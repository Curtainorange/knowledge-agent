# 认知副驾 · 统一 Nginx 子路径 /cognition/
#
# 与 RoamSync 同构：配置文件放**自己项目目录**，由主 nginx.conf 的 include 加载，
# 不改、不动别人的任何配置。
#   本文件部署路径：E:\projects\renzhifujia\nginx\cognition.conf
#   同构样板：      E:\projects\RoamSync-runtime\nginx\roamsync.conf
#
# 动手前先看一眼样板的结构（它已经在跑，结构一定是对的）：
#   type E:\projects\RoamSync-runtime\nginx\roamsync.conf
# 如果样板是「完整 server 块」，本文件也要跟着改成 server 块；
# 如果样板是「location 片段」（子路径共用 80 的情况通常如此），照下面用即可。
#
# 加载方式，先看主配置里是哪一种：
#   ① 主配置已有 Include "E:/projects/*/nginx/*.conf" 这类通配
#      → 把本文件放到上面的部署路径即可，主配置一个字不用改；
#   ② 主配置是逐个文件 include 的
#      → 在主配置里**只加一行**（路径含空格，必须加引号）：
#        include E:/projects/renzhifujia/nginx/cognition.conf;
#
# 铁律：
#   - client_max_body_size 必须留在本 location 内。写进 server/http 层会改掉
#     所有站点的上传上限，那就是在动别人的项目。
#   - 改完先 nginx -t；只有 syntax is ok + test is successful 才 nginx -s reload。
#     校验不通过时 Nginx 拒绝切换，线上仍是旧配置——别人不会因此挂掉。
#   - reload 会重载全部站点（毫秒级）。改前记下别人入口的状态码，改后对比。
#
# 为什么 proxy_pass 结尾要带 "/"：
#   location /cognition/ + proxy_pass http://127.0.0.1:8010/
#   → /cognition/api/v1/chat 被还原成 /api/v1/chat 再送到应用。
#   前缀在这一层就剥掉了，所以后端路由、前端相对路径都不需要知道 /cognition。

# 1) 少尾斜杠会吃掉相对路径的基准目录（assets/x 会被解析成 /assets/x），必须补上
location = /cognition {
    return 301 /cognition/;
}

# 2) 业务本身
location /cognition/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /cognition;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 200m;   # 书籍单份上限 100MB，Nginx 默认 1m 会 413
    proxy_read_timeout 300s;     # 大 PDF/EPUB 解析要几十秒
    proxy_send_timeout 300s;
    proxy_buffering off;         # 流式响应不攒着一次发
}
