<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="/manifest.webmanifest">
<title>冲突检测 · 认知副驾</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="conflicts">

<header class="topbar">
  <div class="brand">认知副驾<span class="sub">L2 冲突检测</span></div>
  <nav class="nav">
    <a href="/app.html" data-nav="app">对话</a>
    <a href="/knowledge.html" data-nav="knowledge">知识库</a>
    <a href="/books.html" data-nav="books">书籍</a>
    <a href="/mine.html" data-nav="mine">L1 挖掘</a>
    <a href="/conflicts.html" data-nav="conflicts">冲突检测</a>
    <a href="/brief.html" data-nav="brief">认知简报</a>
    <a href="/l4.html" data-nav="l4">路径修正</a>
    <a href="/l5.html" data-nav="l5">健康诊断</a>
    <a href="/notify.html" data-nav="notify">通知</a>
  </nav>
  <div class="who">
    <span class="who-name" id="who-name"></span>
    <button id="btn-logout">退出</button>
  </div>
</header>

<main class="single">
  <div class="card">
    <h2>观点冲突
      <button id="btn-scan" class="primary sm">立即扫描</button>
      <button id="btn-reload" class="sm">刷新</button>
    </h2>
    <div class="meta" id="scan-hint">
      扫描会提取知识库里的核心主张，并比对出立场不可兼容的冲突。新录入的内容会自动排一次扫描。
    </div>
    <div class="meta" id="scan-result"></div>
  </div>

  <div class="card">
    <h2>冲突列表 <span class="badge" id="cf-count">0</span></h2>
    <div class="tabs" id="cf-tabs">
      <button class="sm on" data-state="unseen">待处理</button>
      <button class="sm" data-state="accepted">已采纳</button>
      <button class="sm" data-state="ignored">已忽略</button>
      <button class="sm" data-state="">全部</button>
    </div>
    <div class="list" id="cf-list"></div>
  </div>
</main>

<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = CC.$;
  var esc = CC.esc;
  var state = { filter: 'unseen' };

  var STATE_LABEL = { unseen: '待处理', accepted: '已采纳', ignored: '已忽略' };

  function confidenceBadge(value) {
    var pct = Math.round(Number(value || 0) * 100);
    var cls = pct >= 80 ? 'ok' : 'warn';
    return '<span class="badge ' + cls + '">置信度 ' + pct + '%</span>';
  }

  function stateBadge(value) {
    var cls = value === 'accepted' ? 'ok' : (value === 'ignored' ? 'warn' : '');
    return '<span class="badge ' + cls + '">' + esc(STATE_LABEL[value] || value) + '</span>';
  }

  function sideHtml(title, itemId, claim) {
    /* 书籍通读来源（book:<id>）没有知识条目页，标题不做成链接 */
    var isBook = typeof itemId === 'string' && itemId.indexOf('book:') === 0;
    var who = isBook
      ? '<div class="cf-who">' + esc(title) + '</div>'
      : '<div class="cf-who"><a href="/knowledge.html?item=' + esc(itemId) + '">' + esc(title) + '</a></div>';
    return '<div class="cf-side">' +
      who +
      '<div>' + esc(claim || '（该条主张已不存在）') + '</div>' +
    '</div>';
  }

  /* ---- 归因（D 模块）-----------------------------------------------------

     默认收起、点开才请求：归因一次要跑 reasoning，全量预计算等于把过去所有
     扫描的钱再花一遍，而绝大多数冲突用户根本不会点开。
     已分析过的（has_attribution）服务端直接回既有结果，不重复花钱。 */
  function attrRow(label, value) {
    return value ? '<div class="cf-block"><b>' + esc(label) + '：</b>' + esc(value) + '</div>' : '';
  }

  function attributionBodyHtml(a) {
    if (a.state === 'degraded' || a.state === 'skipped') {
      return '<div class="meta">' + esc(a.note || '暂时没法分析这处冲突') + '</div>';
    }
    var out = '';
    out += attrRow('分歧性质', a.cause_type);
    out += '<div class="cf-block"><b>双方背景</b></div>';
    out += attrRow('前者', a.background_a);
    out += attrRow('后者', a.background_b);
    out += '<div class="cf-block"><b>各自成立的前提</b></div>';
    out += attrRow('前者', a.premise_a);
    out += attrRow('后者', a.premise_b);
    out += '<div class="cf-block"><b>适用范围</b></div>';
    out += attrRow('前者', a.boundary_a);
    out += attrRow('后者', a.boundary_b);
    var guides = a.scene_guidance || [];
    if (guides.length) {
      out += '<div class="cf-block"><b>什么场景听谁</b></div>';
      out += guides.map(function (g) {
        var who = g.follow === 'a' ? '听前者' : (g.follow === 'b' ? '听后者' : '两者都要看');
        return '<div class="attr-scene"><b>' + esc(g.scene) + '</b> · ' + esc(who) +
          '：' + esc(g.reason) + '</div>';
      }).join('');
    }
    if (a.probe && a.probe.question) {
      out += '<div class="cf-block"><b>你可以自己验：</b>' + esc(a.probe.question) +
        (a.probe.how_to_check ? '（' + esc(a.probe.how_to_check) + '）' : '') + '</div>';
    }
    return out;
  }

  function attributionHtml(c) {
    var label = c.has_attribution ? '为什么会冲突（已分析）' : '为什么会冲突';
    return '<details class="cf-attr" data-attr-id="' + esc(c.conflict_id) + '">' +
      '<summary>' + label + '</summary>' +
      '<div class="attr-body"><div class="meta">点开我来分析：为什么对立、各自什么时候成立、你怎么自己验。</div></div>' +
    '</details>';
  }

  async function loadAttribution(details, conflictId) {
    if (details.getAttribute('data-loaded') === '1') {
      return;
    }
    details.setAttribute('data-loaded', '1');
    var box = details.querySelector('.attr-body');
    box.innerHTML = '<div class="meta">正在分析…通常十几秒。</div>';
    try {
      var a = await CC.api(
        'POST',
        '/api/v1/l2/conflicts/' + encodeURIComponent(conflictId) + '/attribute',
        {}
      );
      box.innerHTML = attributionBodyHtml(a);
    } catch (err) {
      details.setAttribute('data-loaded', '0');
      box.innerHTML = '<div class="meta">分析失败：' + esc((err && err.message) || err) + '</div>';
    }
  }

  function cardHtml(c) {
    var done = c.user_state !== 'unseen';
    var body = '';
    body += '<div class="cf-head">' +
      '<span class="cf-type">' + esc(c.conflict_type || '冲突') + '</span>' +
      '<span class="cf-pair">' + esc(c.title_a) + ' ↔ ' + esc(c.title_b) + '</span>' +
      confidenceBadge(c.confidence) +
      stateBadge(c.user_state) +
    '</div>';
    body += '<div class="cf-claims">' +
      sideHtml(c.title_a, c.item_a_id, c.claim_a) +
      '<div class="cf-vs">↔</div>' +
      sideHtml(c.title_b, c.item_b_id, c.claim_b) +
    '</div>';
    if (c.detail) {
      body += '<div class="cf-block"><b>依据：</b>' + esc(c.detail) + '</div>';
    }
    if (c.suggestion) {
      body += '<div class="cf-block"><b>建议：</b>' + esc(c.suggestion) + '</div>';
    }
    body += attributionHtml(c);
    body += '<div class="cf-actions" data-id="' + esc(c.conflict_id) + '">';
    if (c.user_state !== 'accepted') {
      body += '<button class="sm" data-act="accepted">采纳</button>';
    }
    if (c.user_state !== 'ignored') {
      body += '<button class="sm" data-act="ignored">忽略</button>';
    }
    if (done) {
      body += '<button class="sm" data-act="unseen">标回待处理</button>';
    }
    body += '</div>';
    return '<div class="conflict' + (done ? ' done' : '') + '">' + body + '</div>';
  }

  function render(items) {
    $('#cf-count').textContent = items.length;
    if (!items.length) {
      $('#cf-list').innerHTML = '<div class="empty">' +
        (state.filter === 'unseen'
          ? '还没有待处理的冲突。先录入几条观点鲜明的知识，再点「立即扫描」。'
          : '这个筛选下没有记录。') +
      '</div>';
      return;
    }
    $('#cf-list').innerHTML = items.map(cardHtml).join('');
  }

  async function load() {
    var query = state.filter ? ('?state=' + encodeURIComponent(state.filter)) : '';
    try {
      var data = await CC.api('GET', '/api/v1/l2/conflicts' + query);
      render(data.items || []);
    } catch (err) {
      $('#cf-list').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    }
  }

  function syncTabs() {
    var buttons = $('#cf-tabs').querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      var on = buttons[i].getAttribute('data-state') === state.filter;
      if (on) {
        buttons[i].classList.add('on');
      } else {
        buttons[i].classList.remove('on');
      }
    }
  }

  async function scan() {
    var button = $('#btn-scan');
    $('#scan-result').textContent = '扫描中…（真实模型逐条判定，条目多时可能需要几分钟）';
    try {
      var result = await CC.withLoading(button, function () {
        return CC.api('POST', '/api/v1/l2/scan');
      }, '扫描中…');
      $('#scan-result').textContent =
        '本轮：扫描条目 ' + result.scanned_items +
        ' · 提取主张 ' + result.claims_extracted +
        ' · 判定 ' + result.pairs_judged + ' 对' +
        ' · 发现冲突 ' + result.conflicts_found +
        (result.conflicts_suppressed ? ' · 抑制 ' + result.conflicts_suppressed : '') +
        (result.extraction_failures ? ' · 提取失败 ' + result.extraction_failures + '（下次自动重试）' : '');
      CC.toast(result.conflicts_found ? ('发现 ' + result.conflicts_found + ' 处冲突') : '本轮没有新冲突');
      await load();
    } catch (err) {
      $('#scan-result').textContent = '扫描失败：' + err.message;
    }
  }

  async function setState(conflictId, next) {
    try {
      await CC.api('PATCH', '/api/v1/l2/conflicts/' + encodeURIComponent(conflictId) + '/state', { state: next });
      CC.toast('已标记为「' + (STATE_LABEL[next] || next) + '」');
      await load();
    } catch (err) {
      CC.toast('操作失败：' + err.message);
    }
  }

  $('#cf-tabs').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-state]');
    if (!button) {
      return;
    }
    state.filter = button.getAttribute('data-state');
    syncTabs();
    load();
  });

  $('#cf-list').addEventListener('click', function (event) {
    /* 归因折叠区：点标题才请求，避免"打开页面就把所有冲突分析一遍" */
    var summary = event.target.closest('.cf-attr > summary');
    if (summary) {
      var details = summary.parentElement;
      loadAttribution(details, details.getAttribute('data-attr-id'));
      return;
    }
    var button = event.target.closest('button[data-act]');
    if (!button) {
      return;
    }
    var box = button.closest('.cf-actions');
    setState(box.getAttribute('data-id'), button.getAttribute('data-act'));
  });

  $('#btn-scan').addEventListener('click', scan);
  $('#btn-reload').addEventListener('click', load);

  (async function boot() {
    if (!(await CC.requireAuth())) {
      return;
    }
    syncTabs();
    await load();
  })();
})();
</script>
</body>
</html>
