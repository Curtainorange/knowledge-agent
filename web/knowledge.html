<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · 认知副驾</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="knowledge">

<header class="topbar">
  <div class="brand">认知副驾<span class="sub">知识库</span></div>
  <nav class="nav">
    <a href="/app.html" data-nav="app">对话</a>
    <a href="/knowledge.html" data-nav="knowledge">知识库</a>
    <a href="/books.html" data-nav="books">书籍</a>
    <a href="/mine.html" data-nav="mine">L1 挖掘</a>
    <a href="/conflicts.html" data-nav="conflicts">冲突检测</a>
    <a href="/brief.html" data-nav="brief">认知简报</a>
    <a href="/l4.html" data-nav="l4">路径修正</a>
    <a href="/l5.html" data-nav="l5">健康诊断</a>
    <a href="/notify.html" data-nav="notify">通知</a>
  </nav>
  <div class="who">
    <span class="who-name" id="who-name"></span>
    <button id="btn-logout">退出</button>
  </div>
</header>

<main>
  <section>
    <div class="card">
      <h2>录入知识</h2>
      <div class="field"><input id="k-title" placeholder="标题，例如：数据库索引实践"></div>
      <div class="field"><textarea id="k-content" placeholder="正文…录入时会同时计算语义向量"></textarea></div>
      <div class="field"><input id="k-tags" placeholder="标签，逗号分隔（可选）"></div>
      <button id="k-submit" class="primary">录入</button>
      <div class="meta" id="k-hint"></div>
    </div>

    <div class="card">
      <h2>概览</h2>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-num" id="st-total">0</div>
          <div class="stat-label">知识条目</div>
        </div>
        <div class="stat-card">
          <div class="stat-num ok" id="st-embedded">0</div>
          <div class="stat-label">已向量化</div>
        </div>
        <div class="stat-card">
          <div class="stat-num warn" id="st-embed-failed">0</div>
          <div class="stat-label">向量失败</div>
        </div>
      </div>
      <div class="src-row" id="st-sources"></div>
      <div class="chip-cloud" id="st-tags"></div>
      <div class="meta">向量化失败会自动退回关键词召回；点击标签可按关键词搜索。</div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>知识列表
        <span>
          <button id="btn-export-md" class="sm">导出 MD</button>
          <button id="btn-export-json" class="sm">导出 JSON</button>
          <button id="btn-reload" class="sm">刷新</button>
        </span>
      </h2>
      <div class="field"><input id="kb-search" type="search" placeholder="搜索标题或正文…"></div>
      <div class="list" id="kb-list"></div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>账号设置</h2>
      <div class="field"><input id="pw-current" type="password" placeholder="当前密码" autocomplete="current-password"></div>
      <div class="field"><input id="pw-new" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password"></div>
      <div class="meta" id="pw-hint">修改密码后，其它设备上的登录会立即失效。</div>
      <button id="pw-submit" class="primary sm">修改密码</button>
      <div class="detail">
        <div class="meta">注销后账号无法登录，数据保留以备审计；此操作不可自助撤销。</div>
        <div class="field"><input id="del-password" type="password" placeholder="输入密码以确认注销" autocomplete="current-password"></div>
        <button id="del-submit" class="danger sm">注销账号</button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = CC.$;
  var esc = CC.esc;
  var PAGE_SIZE = 20;
  var state = { items: [], total: 0, page: 1, detail: {}, selected: null, query: '', loading: false };

  var SOURCE_LABEL = { manual: '手动', weread: '微信读书', book: '书籍' };

  function sourceBadge(source) {
    var key = SOURCE_LABEL[source] ? source : 'other';
    var label = SOURCE_LABEL[source] || source || '未知';
    return '<span class="badge src-' + key + '">' + esc(label) + '</span>';
  }

  function embedBadge(status) {
    if (status === 'embedded') {
      return '<span class="badge ok">已向量化</span>';
    }
    if (status === 'embed_failed') {
      return '<span class="badge warn">向量失败·关键词兜底</span>';
    }
    return '<span class="badge">待向量化</span>';
  }

  function detailHtml(item, pct) {
    var detail = state.detail[item.item_id];
    if (!detail) {
      return '<div class="detail"><div class="meta">加载中…</div></div>';
    }
    return '<div class="detail">' +
      '<h3>全文</h3>' +
      '<div class="full">' + esc(detail.content) + '</div>' +
      '<div class="progress-row">' +
        '<input type="range" min="0" max="100" step="5" value="' + pct + '"' +
          ' data-act="progress" data-id="' + esc(item.item_id) + '">' +
        '<span class="val">' + pct + '%</span>' +
        '<button class="danger sm" data-act="del" data-id="' + esc(item.item_id) + '">删除</button>' +
      '</div>' +
      '<div class="meta">来源 ' + esc(detail.source) + ' · 拖动滑块记录阅读进度</div>' +
    '</div>';
  }

  function renderItems() {
    var box = $('#kb-list');
    if (!state.items.length) {
      box.innerHTML = state.query
        ? '<div class="empty">没有匹配「' + esc(state.query) + '」的条目。</div>'
        : '<div class="empty">知识库还是空的，先在左侧录一条。</div>';
      return;
    }
    var html = state.items.map(function (item) {
      var pct = Math.round((item.read_progress || 0) * 100);
      var open = state.selected === item.item_id;
      return '<div class="item ' + (open ? 'active' : '') + '" data-id="' + esc(item.item_id) + '">' +
        '<div class="row"><strong>' + esc(item.title) + '</strong>' +
          sourceBadge(item.source) + embedBadge(item.embed_status) + '</div>' +
        '<div class="snippet">' + esc(item.snippet) + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="meta">已读 ' + pct + '% · ' + esc((item.tags || []).join('、') || '无标签') + '</div>' +
        (open ? detailHtml(item, pct) : '') +
      '</div>';
    }).join('');
    // 分页条：‹ 第 x / y 页 ›（API 本就支持 limit/offset，此前是「加载更多」追加式）
    var pages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
    html += '<div class="pager">' +
      '<button id="kb-prev" class="sm"' + (state.page <= 1 ? ' disabled' : '') + '>‹</button>' +
      '<span class="meta">第 ' + state.page + ' / ' + pages + ' 页 · 共 ' + state.total + ' 条</span>' +
      '<button id="kb-next" class="sm"' + (state.page >= pages ? ' disabled' : '') + '>›</button>' +
    '</div>';
    box.innerHTML = html;
  }

  /** 拉取指定页；搜索 / 增删后从第 1 页重来（goPage 不传时回第一页）。 */
  async function loadItems(goPage) {
    if (state.loading) {
      return;
    }
    state.loading = true;
    try {
      state.page = goPage || 1;
      var params = 'limit=' + PAGE_SIZE + '&offset=' + (state.page - 1) * PAGE_SIZE;
      if (state.query) {
        params += '&q=' + encodeURIComponent(state.query);
      }
      var data = await CC.api('GET', '/api/v1/knowledge/items?' + params);
      state.total = data.total;
      state.items = data.items;
      state.selected = null;
      // 删掉末页最后一条后当前页可能超界，回退一页
      if (!state.items.length && state.page > 1) {
        state.loading = false;
        return loadItems(state.page - 1);
      }
      renderItems();
    } finally {
      state.loading = false;
    }
  }

  /** 概览统计：总数 / 向量化状态 / 来源分布 / 高频标签。 */
  async function loadStats() {
    var stats = await CC.api('GET', '/api/v1/knowledge/stats');
    $('#st-total').textContent = stats.total;
    var embedded = stats.by_embed_status.embedded || 0;
    var failed = stats.by_embed_status.embed_failed || 0;
    var pending = stats.by_embed_status.pending || 0;
    $('#st-embedded').textContent = embedded;
    $('#st-embed-failed').textContent = failed + pending;
    var order = ['manual', 'weread', 'book'];
    var parts = [];
    order.concat(Object.keys(stats.by_source).filter(function (s) { return order.indexOf(s) < 0; }))
      .forEach(function (s) {
        if (stats.by_source[s]) {
          parts.push('<span class="badge src-' + (SOURCE_LABEL[s] ? s : 'other') + '">' +
            esc(SOURCE_LABEL[s] || s) + ' ' + stats.by_source[s] + '</span>');
        }
      });
    $('#st-sources').innerHTML = parts.join('') || '<span class="meta">暂无条目</span>';
    $('#st-tags').innerHTML = (stats.top_tags || []).map(function (t) {
      return '<button class="chip" data-tag="' + esc(t.tag) + '" title="按「' + esc(t.tag) + '」搜索">' +
        esc(t.tag) + ' <i>' + t.count + '</i></button>';
    }).join('') || '<span class="meta">还没有标签</span>';
  }

  async function selectItem(itemId) {
    state.selected = itemId;
    if (!state.detail[itemId]) {
      renderItems();
      state.detail[itemId] = await CC.api('GET', '/api/v1/knowledge/items/' + itemId);
    }
    renderItems();
    var node = document.querySelector('.item[data-id="' + itemId + '"]');
    if (node && node.scrollIntoView) {
      node.scrollIntoView({ block: 'nearest' });
    }
  }

  $('#kb-list').addEventListener('click', async function (event) {
    var pagerNode = event.target.closest('#kb-prev, #kb-next');
    if (pagerNode && !pagerNode.disabled) {
      loadItems(state.page + (pagerNode.id === 'kb-next' ? 1 : -1))
        .catch(function (err) { CC.toast('翻页失败：' + err.message); });
      return;
    }
    var itemNode = event.target.closest('.item');
    if (!itemNode) {
      return;
    }
    var itemId = itemNode.getAttribute('data-id');
    var actNode = event.target.closest('[data-act]');

    if (actNode && actNode.getAttribute('data-act') === 'del') {
      if (!confirm('确定删除这条知识？（软删除，原文保留）')) {
        return;
      }
      try {
        await CC.api('DELETE', '/api/v1/knowledge/items/' + itemId);
        state.selected = null;
        delete state.detail[itemId];
        await Promise.all([loadItems(state.page), loadStats()]);
        CC.toast('已删除');
      } catch (err) {
        CC.toast('删除失败：' + err.message);
      }
      return;
    }
    if (actNode) {
      return;
    }

    if (state.selected === itemId) {
      state.selected = null;
      renderItems();
      return;
    }
    try {
      await selectItem(itemId);
    } catch (err) {
      state.selected = null;
      renderItems();
      CC.toast('读取详情失败：' + err.message);
    }
  });

  $('#kb-list').addEventListener('change', async function (event) {
    var el = event.target;
    if (el.getAttribute('data-act') !== 'progress') {
      return;
    }
    var itemId = el.getAttribute('data-id');
    var value = Number(el.value) / 100;
    try {
      await CC.api('PATCH', '/api/v1/knowledge/items/' + itemId, { read_progress: value });
      var item = state.items.find(function (x) { return x.item_id === itemId; });
      if (item) {
        item.read_progress = value;
      }
      if (state.detail[itemId]) {
        state.detail[itemId].read_progress = value;
      }
      CC.toast('已记录：已读 ' + el.value + '%');
      renderItems();
    } catch (err) {
      CC.toast('保存进度失败：' + err.message);
    }
  });

  $('#k-submit').addEventListener('click', async function () {
    var title = $('#k-title').value.trim();
    var content = $('#k-content').value.trim();
    if (!title || !content) {
      CC.toast('标题和正文都要填');
      return;
    }
    var tags = $('#k-tags').value.split(/[,，]/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
    var hint = $('#k-hint');
    hint.textContent = '录入中：首次调用会加载本地向量模型，可能需要几十秒…';
    try {
      var result = await CC.withLoading($('#k-submit'), function () {
        return CC.api('POST', '/api/v1/knowledge/items', { title: title, content: content, tags: tags });
      }, '录入中…');
      $('#k-title').value = '';
      $('#k-content').value = '';
      $('#k-tags').value = '';
      hint.textContent = result.embed_status === 'embedded'
        ? '已录入并完成向量化'
        : '已录入，但向量化失败（将退回关键词召回，网络恢复后更新正文即可重算）';
      await Promise.all([loadItems(), loadStats()]);
      CC.toast('录入成功');
    } catch (err) {
      hint.textContent = '录入失败：' + err.message;
      CC.toast('录入失败：' + err.message);
    }
  });

  $('#btn-reload').addEventListener('click', function () {
    loadItems().catch(function (err) { CC.toast('刷新失败：' + err.message); });
  });

  /* 搜索：防抖 300ms，避免每敲一个字都发一次请求 */
  var searchTimer = null;
  $('#kb-search').addEventListener('input', function () {
    var value = this.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = value;
      loadItems(1).catch(function (err) { CC.toast('搜索失败：' + err.message); });
    }, 300);
  });

  /* 标签云：点击把标签词填入搜索框（按关键词搜标题与正文） */
  $('#st-tags').addEventListener('click', function (event) {
    var chip = event.target.closest('.chip');
    if (!chip) {
      return;
    }
    var tag = chip.getAttribute('data-tag');
    $('#kb-search').value = tag;
    state.query = tag;
    loadItems(1).catch(function (err) { CC.toast('搜索失败：' + err.message); });
  });

  /* 导出：带 token 拉取文件流再触发下载
     （普通 <a href> 由浏览器直发、带不了 Authorization，所以走 fetch） */
  async function exportKnowledge(format) {
    try {
      var resp = await fetch('/api/v1/knowledge/export?format=' + format, {
        headers: { Authorization: 'Bearer ' + CC.token() }
      });
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status);
      }
      var blob = await resp.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = format === 'json' ? 'knowledge-export.json' : 'knowledge-export.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      CC.toast('已开始下载');
    } catch (err) {
      CC.toast('导出失败：' + err.message);
    }
  }
  $('#btn-export-md').addEventListener('click', function () { exportKnowledge('markdown'); });
  $('#btn-export-json').addEventListener('click', function () { exportKnowledge('json'); });

  /* 修改密码：后端换哈希并把令牌版本 +1（其它设备立即失效），
     同时回送新令牌，本机不用重新登录 */
  $('#pw-submit').addEventListener('click', async function () {
    var current = $('#pw-current').value;
    var next = $('#pw-new').value;
    if (!current || !next) {
      CC.toast('请填写当前密码与新密码');
      return;
    }
    try {
      var result = await CC.withLoading($('#pw-submit'), function () {
        return CC.api('POST', '/api/v1/auth/password', {
          current_password: current,
          new_password: next
        });
      }, '提交中…');
      CC.setSession(result);
      $('#pw-current').value = '';
      $('#pw-new').value = '';
      $('#pw-hint').textContent = '密码已更新；其它设备上的登录已失效，本机保持登录。';
      CC.toast('密码已更新');
    } catch (err) {
      $('#pw-hint').textContent = '修改失败：' + err.message;
    }
  });

  $('#del-submit').addEventListener('click', async function () {
    var password = $('#del-password').value;
    if (!password) {
      CC.toast('请输入密码以确认注销');
      return;
    }
    if (!confirm('确定注销账号吗？注销后无法登录，数据将保留但不再可用。')) {
      return;
    }
    try {
      await CC.withLoading($('#del-submit'), function () {
        return CC.api('DELETE', '/api/v1/auth/account', { password: password });
      }, '注销中…');
      CC.clearSession();
      CC.toast('账号已注销');
      location.replace('/login.html');
    } catch (err) {
      CC.toast('注销失败：' + err.message);
    }
  });

  (async function boot() {
    if (!(await CC.requireAuth())) {
      return;
    }
    try {
      await Promise.all([loadItems(), loadStats()]);
    } catch (err) {
      CC.toast('加载知识库失败：' + err.message);
      return;
    }
    // 支持从 L1 挖掘页跳转过来直接展开某条
    var wanted = new URLSearchParams(location.search).get('item');
    if (wanted) {
      try {
        await selectItem(wanted);
      } catch (err) {
        CC.toast('该条目可能已被删除');
      }
    }
  })();
})();
</script>
</body>
</html>
