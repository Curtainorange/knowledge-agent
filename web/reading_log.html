<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读日志 · 认知副驾</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="reading">

<header class="topbar">
  <div class="brand">认知副驾<span class="sub">阅读日志</span></div>
  <nav class="nav">
    <a href="/knowledge.html" data-nav="knowledge">知识库</a>
    <a href="/books.html" data-nav="books">书籍</a>
    <a href="/mine.html" data-nav="mine">L1 挖掘</a>
    <a href="/conflicts.html" data-nav="conflicts">冲突检测</a>
    <a href="/brief.html" data-nav="brief">认知简报</a>
    <a href="/l4.html" data-nav="l4">路径修正</a>
    <a href="/l5.html" data-nav="l5">健康诊断</a>
    <a href="/notify.html" data-nav="notify">通知</a>
  </nav>
  <div class="who">
    <span class="who-name" id="who-name"></span>
    <button id="btn-logout">退出</button>
  </div>
</header>

<main class="single">
  <div class="card">
    <h2>阅读概览
      <button id="btn-back" class="sm">← 书架</button>
    </h2>
    <div class="tabs" id="rl-group">
      <button class="sm on" data-group="day">按天</button>
      <button class="sm" data-group="week">按周</button>
      <button class="sm" data-group="month">按月</button>
    </div>
    <div class="meta">最近 <strong id="rl-window">30</strong> 天共读 <strong id="rl-total">0</strong>，
      活跃 <strong id="rl-days">0</strong><span id="rl-unit">天</span>。</div>
  </div>

  <div class="card">
    <h2>阅读趋势</h2>
    <div class="rl-chart" id="rl-chart"></div>
  </div>

  <div class="card">
    <h2>明细</h2>
    <div id="rl-list"></div>
  </div>
</main>

<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = CC.$;
  var esc = CC.esc;
  var WINDOW_DAYS = 30;
  var UNIT = { day: '天', week: '周', month: '月' };
  var state = { group: 'day' };

  function fmtChars(n) {
    n = Number(n || 0);
    if (n >= 10000) {
      return (n / 10000).toFixed(1) + ' 万字';
    }
    return n + ' 字';
  }

  /* 桶标签：日 9/14 · 周 W37 · 月 9月 */
  function shortLabel(key, group) {
    var m;
    if (group === 'week' && (m = /^(\d{4})-W(\d+)$/.exec(key))) {
      return 'W' + Number(m[2]);
    }
    if (group === 'month' && (m = /^(\d{4})-(\d{2})$/.exec(key))) {
      return Number(m[2]) + '月';
    }
    if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key))) {
      return Number(m[2]) + '/' + Number(m[3]);
    }
    return key;
  }

  function fullLabel(key, group) {
    var m;
    if (group === 'week' && (m = /^(\d{4})-W(\d+)$/.exec(key))) {
      return m[1] + ' 年第 ' + Number(m[2]) + ' 周';
    }
    if (group === 'month' && (m = /^(\d{4})-(\d{2})$/.exec(key))) {
      return m[1] + ' 年 ' + Number(m[2]) + ' 月';
    }
    return key;
  }

  /* 纯 CSS 柱状图：左旧右新，高度按桶内字数归一化 */
  function renderChart(buckets, group) {
    var box = $('#rl-chart');
    if (!buckets.length) {
      box.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    var max = Math.max.apply(null, buckets.map(function (b) { return b.total_chars; }).concat([1]));
    var asc = buckets.slice().reverse(); // 时间正序
    box.innerHTML = asc.map(function (b) {
      var h = Math.max(3, Math.round((b.total_chars / max) * 100));
      return '<div class="rl-bar" title="' + esc(fullLabel(b.key, group)) + '：' +
          esc(fmtChars(b.total_chars)) + '">' +
        '<span class="rl-bar-val">' + esc(fmtChars(b.total_chars)) + '</span>' +
        '<div class="rl-bar-track"><i style="height:' + h + '%"></i></div>' +
        '<span class="rl-bar-x">' + esc(shortLabel(b.key, group)) + '</span>' +
      '</div>';
    }).join('');
  }

  function renderList(buckets, group) {
    if (!buckets.length) {
      $('#rl-list').innerHTML = '<div class="empty">还没有阅读记录。<br>去书架打开一本书，读几页就会出现在这里。</div>';
      return;
    }
    $('#rl-list').innerHTML = buckets.map(function (b) {
      var books = (b.books || []).map(function (bk) {
        return '<div class="topic-row">' +
          '<span class="topic-name">' + esc(bk.title) + '</span>' +
          '<span class="topic-levels">' + esc(fmtChars(bk.chars_read)) +
            ' · 已读 ' + Math.round(Number(bk.progress || 0) * 100) + '%</span>' +
        '</div>';
      }).join('');
      return '<div class="question-card">' +
        '<div class="q-head">' + esc(fullLabel(b.key, group)) +
          ' <span class="badge ok">' + esc(fmtChars(b.total_chars)) + '</span></div>' +
        books +
      '</div>';
    }).join('');
  }

  function render(data) {
    var group = data.group || state.group;
    $('#rl-window').textContent = String(WINDOW_DAYS);
    $('#rl-total').textContent = fmtChars(data.total_chars);
    $('#rl-days').textContent = String(data.active_buckets || 0);
    $('#rl-unit').textContent = UNIT[group] || '天';
    renderChart(data.buckets || [], group);
    renderList(data.buckets || [], group);
  }

  async function load(group) {
    state.group = group;
    var tabs = document.querySelectorAll('#rl-group button');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('on', tabs[i].getAttribute('data-group') === group);
    }
    try {
      var data = await CC.api(
        'GET', '/api/v1/books/reading-log?days=' + WINDOW_DAYS + '&group=' + group
      );
      render(data);
    } catch (err) {
      $('#rl-list').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    }
  }

  $('#rl-group').addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-group]');
    if (btn) {
      load(btn.getAttribute('data-group'));
    }
  });

  $('#btn-back').addEventListener('click', function () {
    location.href = '/books.html';
  });

  (async function boot() {
    if (!(await CC.requireAuth())) {
      return;
    }
    await load('day');
  })();
})();
</script>
</body>
</html>
