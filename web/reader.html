<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="认知副驾">
<link rel="manifest" href="/manifest.webmanifest">
<title>阅读器 · 认知副驾</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="books" class="reader-page">

<header class="topbar">
  <div class="brand">认知副驾<span class="sub">阅读器</span></div>
  <div class="reader-tools">
    <button id="btn-back" class="sm"><span class="lbl-full">← 书架</span><span class="lbl-short">←</span></button>
    <button id="btn-toc" class="sm">目录</button>
    <span class="reader-indicator" id="chapter-indicator">—</span>
  </div>
  <div class="who">
    <button id="btn-notes" class="sm"><span class="lbl-full">本书知识</span><span class="lbl-short">知识</span> <span id="notes-count">0</span></button>
    <button id="btn-settings" class="sm" title="阅读设置">Aa</button>
    <button id="font-down" class="sm" title="缩小字号">A-</button>
    <button id="font-up" class="sm" title="放大字号">A+</button>
    <button id="btn-more" class="sm" title="更多" aria-haspopup="true">⋯</button>
    <button id="btn-logout">退出</button>
  </div>
</header>

<div class="more-menu" id="more-menu" hidden>
  <button id="more-settings">阅读设置</button>
  <button id="more-back">← 书架</button>
  <button id="more-logout">退出登录</button>
</div>

<aside class="reader-settings" id="reader-settings" hidden>
  <div class="panel-head">
    <h3>阅读设置</h3>
    <button id="settings-close" class="sm">关闭</button>
  </div>
  <div class="setting-row">
    <span class="setting-label">背景</span>
    <div class="seg" data-setting="theme">
      <button data-value="paper">纸白</button>
      <button data-value="sepia">米黄</button>
      <button data-value="night">夜间</button>
    </div>
  </div>
  <div class="setting-row">
    <span class="setting-label">字号</span>
    <div class="seg" data-setting="font">
      <button data-value="15">小</button>
      <button data-value="18">中</button>
      <button data-value="22">大</button>
    </div>
  </div>
  <div class="setting-row">
    <span class="setting-label">行距</span>
    <div class="seg" data-setting="leading">
      <button data-value="compact">紧凑</button>
      <button data-value="normal">标准</button>
      <button data-value="loose">宽松</button>
    </div>
  </div>
  <div class="setting-row">
    <span class="setting-label">字体</span>
    <div class="seg" data-setting="family">
      <button data-value="sans">黑体</button>
      <button data-value="serif">宋体</button>
    </div>
  </div>
  <div class="setting-row">
    <span class="setting-label">页宽</span>
    <div class="seg" data-setting="width">
      <button data-value="standard">标准</button>
      <button data-value="wide">宽</button>
    </div>
  </div>
</aside>

<main class="single">
  <div class="card reader-card">
    <div class="reader-progress"><i id="progress-fill" style="width:0%"></i></div>
    <div class="reader-title">
      <span id="chapter-title">加载中…</span>
      <span class="reader-meta" id="chapter-meta"></span>
    </div>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-nav">
      <button id="btn-prev" class="sm">‹ 上一章</button>
      <button id="btn-top" class="sm">回到顶部</button>
      <button id="btn-next" class="sm">下一章 ›</button>
    </div>
  </div>
</main>

<aside class="toc-panel" id="toc-panel" hidden>
  <div class="panel-head">
    <h3>目录 <span class="badge" id="toc-count">0</span></h3>
    <button id="toc-close" class="sm">关闭</button>
  </div>
  <div class="toc-list" id="toc-list"></div>
</aside>

<div id="selection-pop">
  <button data-act="excerpt">存摘录</button>
  <button data-act="thought">写想法</button>
</div>

<div class="thought-drawer" id="thought-drawer" hidden>
  <div class="quote" id="thought-quote"></div>
  <textarea id="thought-input" placeholder="写下你此刻的想法…（会和这段原文一起存为一条知识）"></textarea>
  <div class="row-actions">
    <button id="thought-cancel" class="sm">取消</button>
    <button id="thought-save" class="primary sm">保存</button>
  </div>
</div>

<aside class="notes-panel" id="notes-panel" hidden>
  <div class="panel-head">
    <h3>本书知识</h3>
    <button id="notes-close" class="sm">关闭</button>
  </div>
  <div id="notes-list"></div>
</aside>

<div class="img-lightbox" id="img-lightbox" hidden>
  <div class="lb-bar">
    <span class="lb-counter" id="lb-counter">1 / 1</span>
    <span class="lb-tools">
      <button type="button" id="lb-zoom-out" title="缩小（-）">−</button>
      <button type="button" id="lb-zoom-fit" title="适应屏幕（0）">适应</button>
      <button type="button" id="lb-zoom-in" title="放大（+）">＋</button>
      <button type="button" id="lb-close" title="关闭（Esc）">关闭</button>
    </span>
  </div>
  <button type="button" class="lb-nav lb-prev" id="lb-prev" title="上一张（←）">‹</button>
  <div class="lb-stage" id="lb-stage"><img id="lightbox-img" alt=""></div>
  <button type="button" class="lb-nav lb-next" id="lb-next" title="下一张（→）">›</button>
</div>

<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = CC.$;
  var esc = CC.esc;

  var bookId = new URLSearchParams(location.search).get('book');

  /* 字号三档（小/中/大）：移动端顶栏放不下连续调节，A-/A+ 在三档间步进 */
  var FONT_TIERS = [15, 18, 22];

  /* 排版偏好：只影响阅读页。全部存 localStorage，换设备不跟随（没有账号级配置）。 */
  var PREFS_KEY = 'reader_prefs';
  var PREFS_ALLOWED = {
    theme: ['paper', 'sepia', 'night'],
    leading: ['compact', 'normal', 'loose'],
    family: ['sans', 'serif'],
    width: ['standard', 'wide']
  };
  var PREFS_DEFAULT = { theme: 'paper', leading: 'normal', family: 'sans', width: 'standard' };
  var PREFS_LEADING = { compact: '1.65', normal: '1.95', loose: '2.3' };
  var PREFS_FAMILY = {
    sans: '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif',
    serif: 'Georgia,"Songti SC","Songti TC","Noto Serif SC",serif'
  };
  var PREFS_WIDTH = { standard: '840px', wide: '1080px' };

  function tierIndex(px) {
    var best = 0;
    for (var i = 1; i < FONT_TIERS.length; i++) {
      if (Math.abs(FONT_TIERS[i] - px) < Math.abs(FONT_TIERS[best] - px)) {
        best = i;
      }
    }
    return best;
  }

  /* 读偏好：任何一项不合法就回落到默认值，坏掉的存档不该让阅读页起不来 */
  function loadPrefs() {
    var raw = {};
    try {
      raw = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {};
    } catch (err) {
      raw = {};
    }
    var prefs = {};
    Object.keys(PREFS_ALLOWED).forEach(function (key) {
      prefs[key] = PREFS_ALLOWED[key].indexOf(raw[key]) >= 0 ? raw[key] : PREFS_DEFAULT[key];
    });
    return prefs;
  }

  var state = {
    book: null,
    chapter: null,
    notes: [],
    font: FONT_TIERS[tierIndex(Number(localStorage.getItem('reader_font') || 18))],
    prefs: loadPrefs(),
    saveTimer: null,
    pendingSelection: null
  };

  if (!bookId) {
    location.replace('/books.html');
  }

  function chapterByIndex(index) {
    return (state.book.chapters || []).find(function (c) { return c.index === index; });
  }

  function currentChapterIndex() {
    if (!state.book || !state.book.chapters || !state.book.chapters.length) {
      return null;
    }
    var ch = (state.book.chapters || []).find(function (c) {
      return state.book.current_char >= c.char_start && state.book.current_char < c.char_end;
    });
    return ch ? ch.index : state.book.chapters[0].index;
  }

  /* 应用字号。keepPosition：用户手动调字号时保住当前阅读位置——
     字号一变正文高度就变，不同步按比例回滚就会「跳页」（读到一半突然跑到章首）。 */
  function applyFont(keepPosition) {
    var body = $('#reader-body');
    var max = body.scrollHeight - body.clientHeight;
    var ratio = max > 0 ? body.scrollTop / max : 0;
    body.style.fontSize = state.font + 'px';
    localStorage.setItem('reader_font', String(state.font));
    syncSettingButtons();
    if (keepPosition && max > 0) {
      requestAnimationFrame(function () { restoreScroll(body, ratio); });
    }
  }

  /* 计算已录入区间的高亮标记：绿色=带想法，黄色=纯摘录（偏移基于 full_text 字符） */
  function computeMarks(text, chapter) {
    return (state.notes || [])
      .filter(function (n) { return n.char_start != null && n.char_end != null; })
      .map(function (n) {
        return {
          itemId: n.item_id,
          hasNote: !!n.note,
          start: Math.max(0, n.char_start - chapter.char_start),
          end: Math.min(text.length, n.char_end - chapter.char_start)
        };
      })
      .filter(function (m) { return m.end > 0 && m.end > m.start; })
      .sort(function (a, b) { return a.start - b.start; });
  }

  /* 输出 [start, end) 的文本段，应用落在该区间内的高亮 */
  function renderTextRange(text, start, end, marks) {
    if (start >= end) {
      return '';
    }
    var seg = text.slice(start, end);
    var inner = marks
      .map(function (m) {
        return {
          itemId: m.itemId,
          hasNote: m.hasNote,
          start: Math.max(start, m.start) - start,
          end: Math.min(end, m.end) - start
        };
      })
      .filter(function (m) { return m.end > 0 && m.end > m.start; })
      .sort(function (a, b) { return a.start - b.start; });

    if (!inner.length) {
      return esc(seg);
    }
    var html = '';
    var cursor = 0;
    inner.forEach(function (m) {
      if (m.start < cursor) {
        return; // 区间重叠时跳过后者，避免标签错位
      }
      html += esc(seg.slice(cursor, m.start));
      html += '<mark class="' + (m.hasNote ? 'mark-note' : 'mark-excerpt') +
        '" data-item="' + esc(m.itemId) + '">' + esc(seg.slice(m.start, m.end)) + '</mark>';
      cursor = m.end;
    });
    html += esc(seg.slice(cursor));
    return html;
  }

  /* 页码标记：**空 span**，页码由 CSS 伪元素显示。
     必须是空的——划词偏移按 DOM 文本长度算（getSelectionInfo），
     插进真字符会让所有高亮与摘录的 char_start 整体错位。
     显示值优先用页面原印的页码（能对照纸书），没识别到才退回物理页。 */
  function pageMarkHtml(mark) {
    var physical = Number(mark.page) || 0;
    var label = (mark.label || '').trim();
    var show = label ? 'P.' + label : '第 ' + physical + ' 页';
    var title = label ? '原书第 ' + label + ' 页' : 'PDF 第 ' + physical + ' 页';
    return '<span class="page-mark" data-show="' + esc(show) + '" title="' + esc(title) + '"></span>';
  }

  /* 渲染正文：文本 + 插图占位符 [[IMG:name]] → <img> + 页码标记。
     插图后紧跟一个隐藏的占位 span，保留原始字符，保证划词/高亮的字符偏移不错位。
     页码与插图一起按位置排序后统一插入，避免两条渲染路径各写一份。 */
  function renderContent(text, chapter, pageMarks) {
    var marks = computeMarks(text, chapter);
    var events = [];
    var regex = /\[\[IMG:([^\]]+)\]\]/g;
    var match;
    while ((match = regex.exec(text)) !== null) {
      var name = match[1];
      // 图片由浏览器直接加载，带不了 Authorization 头，故用 ?token= 兜底。
      // 不用 loading="lazy"：位置恢复要在图片加载完成后校准（lazy 会让 complete 长期为假）。
      var imgUrl = '/api/v1/books/' + bookId + '/images/' + encodeURIComponent(name) +
        '?token=' + encodeURIComponent(CC.token() || '');
      events.push({
        at: match.index,
        end: match.index + match[0].length,
        html: '<figure class="reader-figure">' +
          '<img src="' + imgUrl + '" alt="插图（点击放大）" title="点击放大">' +
          '<span class="img-pos">[[IMG:' + esc(name) + ']]</span>' +
        '</figure>'
      });
    }
    (pageMarks || []).forEach(function (mark) {
      var at = Number(mark.offset);
      if (!isFinite(at)) {
        return;
      }
      at = Math.max(0, Math.min(text.length, at));
      events.push({ at: at, end: at, html: pageMarkHtml(mark) });
    });
    // 同一位置的零宽标记（页码）排在带长度的元素（插图）之前
    events.sort(function (a, b) {
      if (a.at !== b.at) {
        return a.at - b.at;
      }
      return (a.end - a.at) - (b.end - b.at);
    });

    var html = '';
    var cursor = 0;
    events.forEach(function (event) {
      if (event.at < cursor) {
        return; // 区间重叠时跳过后者，避免标签错位
      }
      html += renderTextRange(text, cursor, event.at, marks);
      html += event.html;
      cursor = Math.max(cursor, event.end);
    });
    html += renderTextRange(text, cursor, text.length, marks);
    return html;
  }

  /* 竖版长图 = 扫描书的一页。标记后由 CSS 取消 max-height，按正文宽度铺满，
     否则 3:4 的扫描页会被压到 347px 宽，小字完全看不清。 */
  function markPageImages(body) {
    Array.prototype.forEach.call(body.querySelectorAll('img'), function (im) {
      function tag() {
        if (!im.naturalWidth || !im.naturalHeight) {
          return;
        }
        im.classList.toggle('is-page', im.naturalHeight >= im.naturalWidth * 1.15);
      }
      if (im.complete && im.naturalWidth) {
        tag();
      } else {
        im.addEventListener('load', tag);
      }
    });
  }

  /* 按比例恢复章内滚动位置；插图加载完成后会再调用一次校准 */
  function restoreScroll(body, ratio) {    var max = body.scrollHeight - body.clientHeight;
    body.scrollTop = Math.max(0, ratio * max);
    updateNavAndProgress();
  }

  async function loadChapter(index, scrollRatio) {
    var data = await CC.api('GET', '/api/v1/books/' + bookId + '/chapter/' + index);
    state.chapter = data.index;
    var body = $('#reader-body');
    $('#chapter-title').textContent = data.title;
    body.innerHTML = renderContent(
      data.content, chapterByIndex(index) || { char_start: 0 }, data.page_marks
    );
    markPageImages(body);
    applyFont();
    body.scrollTop = 0;

    if (scrollRatio != null) {
      requestAnimationFrame(function () {
        restoreScroll(body, scrollRatio);
        // 插图会把布局撑高：图片未加载完时算出的 scrollTop 会偏前（表现为「只恢复到章首附近」）。
        // 等这一章的图片都加载（或失败）后，再按同一比例校准一次。
        var imgs = Array.prototype.slice.call(body.querySelectorAll('img'));
        var pending = 0;
        imgs.forEach(function (im) {
          if (im.complete) {
            return;
          }
          pending++;
          var done = function () {
            pending--;
            if (pending <= 0) {
              restoreScroll(body, scrollRatio);
            }
          };
          im.addEventListener('load', done);
          im.addEventListener('error', done);
        });
      });
    }
    updateNavAndProgress();
  }

  function renderBookInfo() {
    document.querySelector('.brand .sub').textContent = '阅读 · ' + state.book.title;
  }

  /* ---------- 目录 ---------- */
  function orderedChapters() {
    return (state.book.chapters || []).slice().sort(function (a, b) {
      return a.index - b.index;
    });
  }

  function renderToc() {
    var chapters = orderedChapters();
    $('#toc-count').textContent = String(chapters.length);
    if (!chapters.length) {
      $('#toc-list').innerHTML = '<div class="empty">这本书没有分章。</div>';
      return;
    }
    $('#toc-list').innerHTML = chapters.map(function (c) {
      var on = c.index === state.chapter ? ' on' : '';
      return '<div class="toc-item' + on + '" data-index="' + c.index + '">' +
        '<span class="toc-no">' + c.index + '</span>' +
        '<span class="toc-title">' + esc(c.title) + '</span>' +
      '</div>';
    }).join('');
  }

  function openToc() {
    renderToc();
    var panel = $('#toc-panel');
    panel.hidden = false;
    // 打开时把当前章节滚到可视区中间，长目录也能立刻定位
    var on = $('#toc-list').querySelector('.toc-item.on');
    if (on) {
      on.scrollIntoView({ block: 'center' });
    }
  }

  function positionOf(index) {
    var chapters = orderedChapters();
    for (var i = 0; i < chapters.length; i++) {
      if (chapters[i].index === index) {
        return i;
      }
    }
    return -1;
  }

  async function goChapter(index) {
    if (index == null || index === state.chapter) {
      return;
    }
    saveProgress();
    await loadChapter(index, null);
  }

  function goPrev() {
    var chapters = orderedChapters();
    var pos = positionOf(state.chapter);
    if (pos <= 0) {
      CC.toast('已经是第一章');
      return;
    }
    goChapter(chapters[pos - 1].index);
  }

  function goNext() {
    var chapters = orderedChapters();
    var pos = positionOf(state.chapter);
    if (pos < 0 || pos >= chapters.length - 1) {
      CC.toast('已经是最后一章');
      return;
    }
    goChapter(chapters[pos + 1].index);
  }

  /* 顶部进度条 + 章节指示：全书进度 = (已过章节数 + 当前章内滚动比例) / 总章数 */
  function updateNavAndProgress() {
    var chapters = orderedChapters();
    var pos = positionOf(state.chapter);
    var total = chapters.length || 1;
    var body = $('#reader-body');
    var max = body.scrollHeight - body.clientHeight;
    var innerRatio = max > 0 ? Math.min(1, Math.max(0, body.scrollTop / max)) : 0;
    var overall = total ? (Math.max(0, pos) + innerRatio) / total : 0;

    $('#progress-fill').style.width = (overall * 100).toFixed(1) + '%';
    $('#chapter-indicator').textContent = (pos >= 0 ? (pos + 1) : '—') + ' / ' + total + ' 章';
    $('#chapter-meta').textContent = '全书 ' + Math.round(overall * 100) + '%';
    $('#btn-prev').disabled = pos <= 0;
    $('#btn-next').disabled = pos < 0 || pos >= total - 1;
  }

  /* ---------- 本书知识面板 ---------- */
  function renderNotesPanel() {
    $('#notes-count').textContent = String(state.notes.length);
    var box = $('#notes-list');
    if (!state.notes.length) {
      box.innerHTML = '<div class="empty">这本书还没有记录。<br>选中正文里的文字即可存为知识。</div>';
      return;
    }
    box.innerHTML = state.notes.map(function (n) {
      return '<div class="note-card" data-item="' + esc(n.item_id) + '">' +
        '<div class="excerpt">' + esc(n.excerpt) + '</div>' +
        (n.note ? '<div class="thought">' + esc(n.note) + '</div>' : '') +
        '<div class="meta">' + (n.chapter_index != null ? '第 ' + n.chapter_index + ' 章 · ' : '') +
          (n.note ? '含想法' : '摘录') + '</div>' +
      '</div>';
    }).join('');
  }

  async function reloadNotes() {
    try {
      var data = await CC.api('GET', '/api/v1/books/' + bookId + '/notes');
      state.notes = data.items || [];
    } catch (err) {
      state.notes = [];
    }
    renderNotesPanel();
  }

  async function jumpToNote(itemId) {
    var note = state.notes.find(function (n) { return n.item_id === itemId; });
    if (!note) {
      return;
    }
    if (note.chapter_index != null && note.chapter_index !== state.chapter) {
      await loadChapter(note.chapter_index, null);
    }
    requestAnimationFrame(function () {
      var el = document.querySelector('mark[data-item="' + itemId + '"]');
      if (!el) {
        CC.toast('未能定位到原文（可能是旧数据）');
        return;
      }
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('flash');
      setTimeout(function () { el.classList.remove('flash'); }, 1600);
    });
    $('#notes-panel').hidden = true;
  }

  $('#btn-notes').addEventListener('click', function () {
    $('#notes-panel').hidden = !$('#notes-panel').hidden;
    renderNotesPanel();
  });
  $('#notes-close').addEventListener('click', function () {
    $('#notes-panel').hidden = true;
  });
  $('#notes-list').addEventListener('click', function (event) {
    var card = event.target.closest('.note-card');
    if (card) {
      jumpToNote(card.getAttribute('data-item'));
    }
  });

  /* ---------- 划词：存摘录 / 写想法 ---------- */
  var pop = $('#selection-pop');
  var drawer = $('#thought-drawer');

  function hidePop() {
    pop.classList.remove('show');
  }

  function showPop(x, y) {
    pop.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    pop.style.top = Math.max(8, y - 46) + 'px';
    pop.classList.add('show');
  }

  function getSelectionInfo() {
    var sel = window.getSelection();
    var text = sel ? sel.toString().trim() : '';
    var body = $('#reader-body');
    if (!sel || !sel.anchorNode || !body.contains(sel.anchorNode) || text.length < 2) {
      return null;
    }
    // 用 Range 计算选区在章节文本中的字符偏移
    var range = sel.getRangeAt(0).cloneRange();
    var pre = document.createRange();
    pre.selectNodeContents(body);
    pre.setEnd(range.startContainer, range.startOffset);
    var localStart = pre.toString().length;
    return { text: text.slice(0, 4000), localStart: localStart, localEnd: localStart + text.length };
  }

  async function saveNote(text, note, localStart, localEnd) {
    var chapter = chapterByIndex(state.chapter) || { char_start: 0 };
    var payload = {
      text: text,
      note: note || '',
      chapter_index: state.chapter,
      char_start: chapter.char_start + localStart,
      char_end: chapter.char_start + localEnd
    };
    await CC.api('POST', '/api/v1/books/' + bookId + '/notes', payload);
    // 重新渲染以显示高亮，但要保住当前阅读位置（否则每存一次就跳回顶部）
    var body = $('#reader-body');
    var keepTop = body.scrollTop;
    await reloadNotes();
    await loadChapter(state.chapter, null);
    body.scrollTop = keepTop;
    CC.toast(note ? '已记入知识库（含想法）' : '已记入知识库');
  }

  pop.addEventListener('click', async function (event) {
    var act = event.target.closest('[data-act]');
    if (!act || !state.pendingSelection) {
      return;
    }
    var info = state.pendingSelection;
    hidePop();

    if (act.getAttribute('data-act') === 'excerpt') {
      try {
        await saveNote(info.text, '', info.localStart, info.localEnd);
      } catch (err) {
        CC.toast('保存失败：' + err.message);
      }
      window.getSelection().removeAllRanges();
      return;
    }

    // 写想法：弹出抽屉，带着选中的原文
    $('#thought-quote').textContent = info.text;
    $('#thought-input').value = '';
    drawer.hidden = false;
    $('#thought-input').focus();
  });

  $('#thought-cancel').addEventListener('click', function () {
    drawer.hidden = true;
    state.pendingSelection = null;
    window.getSelection().removeAllRanges();
  });

  $('#thought-save').addEventListener('click', async function () {
    var info = state.pendingSelection;
    if (!info) {
      drawer.hidden = true;
      return;
    }
    var thought = $('#thought-input').value.trim();
    try {
      await saveNote(info.text, thought, info.localStart, info.localEnd);
    } catch (err) {
      CC.toast('保存失败：' + err.message);
    }
    drawer.hidden = true;
    state.pendingSelection = null;
    window.getSelection().removeAllRanges();
  });

  document.addEventListener('mouseup', function (event) {
    if (pop.contains(event.target) || drawer.contains(event.target)) {
      return;
    }
    var info = getSelectionInfo();
    if (info) {
      state.pendingSelection = info;
      showPop(event.clientX, event.clientY);
    } else {
      hidePop();
    }
  });

  /* 触控：左右滑翻章——水平位移 ≥60px 且主导（>|1.5×垂直|）才触发，
     纵向阅读滚动原样放行；触摸端没有 mouseup，划词弹层由 touchend 接住
     （松开后选区才稳定，延后一拍取选区）。 */
  (function () {
    var body = $('#reader-body');
    var startX = 0;
    var startY = 0;
    var multi = false;

    body.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) {
        multi = true;
        return;
      }
      multi = false;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    body.addEventListener('touchend', function (e) {
      if (multi || !$('#img-lightbox').hidden || !drawer.hidden) {
        return;
      }
      var t = e.changedTouches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        hidePop();
        if (dx < 0) {
          goNext();
        } else {
          goPrev();
        }
        return;
      }
      setTimeout(function () {
        var info = getSelectionInfo();
        if (!info) {
          hidePop();
          return;
        }
        state.pendingSelection = info;
        var rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
        showPop(rect.left + rect.width / 2, rect.top);
      }, 30);
    }, { passive: true });
  })();

  // 快捷键：Ctrl/Cmd + Enter 存摘录；← / → 翻章；Esc 关闭浮层
  document.addEventListener('keydown', function (event) {
    var tag = (event.target.tagName || '').toUpperCase();
    var typing = tag === 'INPUT' || tag === 'TEXTAREA';

    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      var info = getSelectionInfo();
      if (!info) {
        return;
      }
      event.preventDefault();
      hidePop();
      saveNote(info.text, '', info.localStart, info.localEnd)
        .then(function () { window.getSelection().removeAllRanges(); })
        .catch(function (err) { CC.toast('保存失败：' + err.message); });
      return;
    }

    if (event.key === 'Escape') {
      hidePop();
      drawer.hidden = true;
      $('#notes-panel').hidden = true;
      $('#toc-panel').hidden = true;
      $('#more-menu').hidden = true;
      $('#reader-settings').hidden = true;
      closeLightbox();
      return;
    }

    if (typing || !drawer.hidden) {
      return; // 正在输入 / 摘录抽屉打开时不拦截方向键
    }
    // 大图查看器打开时：← → 切图，+ − 缩放，0 适应屏幕，Esc 关（上面已处理）
    if (!$('#img-lightbox').hidden) {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        lbStep(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        lbStep(1);
      } else if (event.key === '+' || event.key === '=') {
        event.preventDefault();
        lbZoom(1.35);
      } else if (event.key === '-') {
        event.preventDefault();
        lbZoom(1 / 1.35);
      } else if (event.key === '0') {
        lbReset();
      }
      return;
    }
    if (event.key === 'ArrowLeft') {
      event.preventDefault();
      goPrev();
    } else if (event.key === 'ArrowRight') {
      event.preventDefault();
      goNext();
    }
  });

  /* ---------- 进度保存 ---------- */
  function saveProgress() {
    var chapter = chapterByIndex(state.chapter);
    if (!chapter) {
      return;
    }
    var body = $('#reader-body');
    var max = body.scrollHeight - body.clientHeight;
    var ratio = max > 0 ? body.scrollTop / max : 0;
    var span = chapter.char_end - chapter.char_start;
    var globalChar = chapter.char_start + Math.floor(ratio * span);
    var progress = state.book.total_chars ? Math.min(1, globalChar / state.book.total_chars) : 0;
    CC.api('PATCH', '/api/v1/books/' + bookId + '/progress', {
      current_char: globalChar,
      read_progress: progress
    }).catch(function () { /* 后台行为，失败不打断阅读 */ });
  }

  function scheduleSave() {
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(saveProgress, 800);
  }

  $('#btn-back').addEventListener('click', function () {
    saveProgress();
    location.href = '/books.html';
  });

  /* 目录面板 */
  $('#btn-toc').addEventListener('click', function () {
    if ($('#toc-panel').hidden) {
      openToc();
    } else {
      $('#toc-panel').hidden = true;
    }
  });
  $('#toc-close').addEventListener('click', function () {
    $('#toc-panel').hidden = true;
  });
  $('#toc-list').addEventListener('click', function (event) {
    var item = event.target.closest('.toc-item');
    if (!item) {
      return;
    }
    $('#toc-panel').hidden = true;
    goChapter(Number(item.getAttribute('data-index')));
  });

  /* 抽屉上滑关闭：手势只挂在 panel-head（它不随内容滚动），
     与 toc/notes 列表的纵向滚动零冲突 */
  function bindSwipeUpClose(panel, close) {
    var head = panel.querySelector('.panel-head');
    var y0 = null;
    head.addEventListener('touchstart', function (e) {
      y0 = e.touches.length === 1 ? e.touches[0].clientY : null;
    }, { passive: true });
    head.addEventListener('touchend', function (e) {
      if (y0 == null) {
        return;
      }
      var dy = e.changedTouches[0].clientY - y0;
      y0 = null;
      if (dy <= -40) {
        close();
      }
    }, { passive: true });
  }
  bindSwipeUpClose($('#toc-panel'), function () { $('#toc-panel').hidden = true; });
  bindSwipeUpClose($('#notes-panel'), function () { $('#notes-panel').hidden = true; });

  /* 顶栏收纳（移动）：书架/退出进 ⋯ 菜单；菜单动作转发给原按钮，
     复用其既有逻辑（退出=app.js 会话清理，书架=保存进度后跳转） */
  var moreMenu = $('#more-menu');
  $('#btn-more').addEventListener('click', function (e) {
    e.stopPropagation();
    moreMenu.hidden = !moreMenu.hidden;
  });
  document.addEventListener('click', function (e) {
    if (!moreMenu.hidden && !moreMenu.contains(e.target)) {
      moreMenu.hidden = true;
    }
  });
  $('#more-back').addEventListener('click', function () {
    moreMenu.hidden = true;
    $('#btn-back').click(); // display:none 的原按钮仍可编程触发
  });
  $('#more-logout').addEventListener('click', function () {
    moreMenu.hidden = true;
    $('#btn-logout').click();
  });

  /* 翻章 / 回到顶部 */
  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-next').addEventListener('click', goNext);
  $('#btn-top').addEventListener('click', function () {
    $('#reader-body').scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- 插图查看器：翻页 + 缩放 + 拖动 ----------
     扫描书一页就是一张图，放大看小字时必须能直接切下一张，
     不能再「关掉 → 找下一张 → 点开」。图片列表取当前章节渲染出的 <img>。 */
  var lb = { imgs: [], index: 0, scale: 1, tx: 0, ty: 0 };

  function lbImages() {
    return Array.prototype.slice.call(
      document.querySelectorAll('#reader-body .reader-figure img')
    );
  }

  function lbApply() {
    $('#lightbox-img').style.transform =
      'translate(' + lb.tx + 'px,' + lb.ty + 'px) scale(' + lb.scale + ')';
    $('#lb-stage').classList.toggle('is-zoomed', lb.scale > 1.001);
  }

  function lbReset() {
    lb.scale = 1;
    lb.tx = 0;
    lb.ty = 0;
    lbApply();
  }

  function lbShow(index) {
    var total = lb.imgs.length;
    if (!total) {
      return;
    }
    lb.index = Math.max(0, Math.min(total - 1, index));
    $('#lightbox-img').src = lb.imgs[lb.index].src;
    $('#lb-counter').textContent = (lb.index + 1) + ' / ' + total;
    $('#lb-prev').disabled = lb.index <= 0;
    $('#lb-next').disabled = lb.index >= total - 1;
    lbReset();
  }

  function lbStep(delta) {
    if (!lb.imgs.length) {
      return;
    }
    var next = lb.index + delta;
    if (next < 0 || next >= lb.imgs.length) {
      return;
    }
    lbShow(next);
  }

  function lbZoom(factor) {
    lb.scale = Math.max(1, Math.min(5, lb.scale * factor));
    if (lb.scale <= 1.001) {
      lb.scale = 1;
      lb.tx = 0;
      lb.ty = 0;
    }
    lbApply();
  }

  function closeLightbox() {
    var box = $('#img-lightbox');
    if (!box.hidden) {
      box.hidden = true;
      $('#lightbox-img').src = '';
      lb.imgs = [];
      lbReset();
    }
  }

  function openLightbox(img) {
    lb.imgs = lbImages();
    var i = lb.imgs.indexOf(img);
    lbShow(i < 0 ? 0 : i);
    $('#img-lightbox').hidden = false;
  }

  $('#reader-body').addEventListener('click', function (event) {
    var img = event.target.closest('img');
    if (!img || !img.src) {
      return;
    }
    openLightbox(img);
  });

  $('#lb-prev').addEventListener('click', function (event) {
    event.stopPropagation();
    lbStep(-1);
  });
  $('#lb-next').addEventListener('click', function (event) {
    event.stopPropagation();
    lbStep(1);
  });
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-zoom-in').addEventListener('click', function () { lbZoom(1.35); });
  $('#lb-zoom-out').addEventListener('click', function () { lbZoom(1 / 1.35); });
  $('#lb-zoom-fit').addEventListener('click', lbReset);

  /* 点空白处关闭；点图片本身留给双击缩放 */
  $('#img-lightbox').addEventListener('click', function (event) {
    var id = event.target.id;
    if (id === 'img-lightbox' || id === 'lb-stage') {
      closeLightbox();
    }
  });

  /* 双击：适应屏幕 ↔ 2 倍 */
  $('#lightbox-img').addEventListener('dblclick', function (event) {
    event.stopPropagation();
    if (lb.scale > 1.001) {
      lbReset();
    } else {
      lb.scale = 2;
      lbApply();
    }
  });

  /* 滚轮缩放 */
  $('#lb-stage').addEventListener('wheel', function (event) {
    event.preventDefault();
    lbZoom(event.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  /* 拖动平移（放大后才生效，避免和「点一下关闭」冲突） */
  (function () {
    var stage = $('#lb-stage');
    var img = $('#lightbox-img');
    var dragging = false;
    var sx = 0, sy = 0, ox = 0, oy = 0;

    stage.addEventListener('pointerdown', function (event) {
      if (lb.scale <= 1.001) {
        return;
      }
      dragging = true;
      sx = event.clientX;
      sy = event.clientY;
      ox = lb.tx;
      oy = lb.ty;
      stage.classList.add('is-dragging');
      try { img.setPointerCapture(event.pointerId); } catch (err) { /* 指针已释放 */ }
    });
    stage.addEventListener('pointermove', function (event) {
      if (!dragging) {
        return;
      }
      lb.tx = ox + (event.clientX - sx);
      lb.ty = oy + (event.clientY - sy);
      lbApply();
    });
    function endDrag() {
      dragging = false;
      stage.classList.remove('is-dragging');
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
  })();

  /* 触摸：未放大时左右滑切图；双指捏合缩放 */
  (function () {
    var box = $('#img-lightbox');
    var startX = 0, startY = 0, startDist = 0, startScale = 1, multi = false;

    box.addEventListener('touchstart', function (event) {
      if (event.touches.length === 2) {
        multi = true;
        startDist = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        startScale = lb.scale;
        return;
      }
      multi = false;
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });

    box.addEventListener('touchmove', function (event) {
      if (event.touches.length === 2 && startDist > 0) {
        var dist = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        lb.scale = Math.max(1, Math.min(5, startScale * (dist / startDist)));
        lbApply();
      }
    }, { passive: true });

    box.addEventListener('touchend', function (event) {
      if (multi) {
        multi = false;
        startDist = 0;
        return;
      }
      if (lb.scale > 1.001) {
        return; // 放大后单指是拖动，不切图
      }
      var touch = event.changedTouches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        lbStep(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  })();

  /* ---------- 阅读设置（背景 / 行距 / 字体 / 页宽） ---------- */
  function syncSettingButtons() {
    Array.prototype.forEach.call(
      document.querySelectorAll('.seg[data-setting]'),
      function (seg) {
        var key = seg.getAttribute('data-setting');
        var current = key === 'font' ? String(state.font) : state.prefs[key];
        Array.prototype.forEach.call(seg.querySelectorAll('button'), function (btn) {
          btn.classList.toggle('on', btn.getAttribute('data-value') === current);
        });
      }
    );
  }

  /* 偏好落到 CSS 变量上，样式规则只有一份（web/assets/style.css） */
  function applyPrefs() {
    var root = document.body;
    root.dataset.theme = state.prefs.theme;
    root.style.setProperty('--rd-lh', PREFS_LEADING[state.prefs.leading]);
    root.style.setProperty('--rd-font', PREFS_FAMILY[state.prefs.family]);
    root.style.setProperty('--rd-width', PREFS_WIDTH[state.prefs.width]);
    syncSettingButtons();
  }

  function setPref(key, value) {
    if (key === 'font') {
      var px = Number(value);
      if (!isFinite(px)) {
        return;
      }
      state.font = px;
      applyFont(true);
      return;
    }
    if (!PREFS_ALLOWED[key] || PREFS_ALLOWED[key].indexOf(value) < 0) {
      return;
    }
    state.prefs[key] = value;
    localStorage.setItem(PREFS_KEY, JSON.stringify(state.prefs));
    applyPrefs();
  }

  $('#reader-settings').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-value]');
    if (!btn) {
      return;
    }
    var seg = btn.closest('.seg[data-setting]');
    if (seg) {
      setPref(seg.getAttribute('data-setting'), btn.getAttribute('data-value'));
    }
  });
  $('#settings-close').addEventListener('click', function () {
    $('#reader-settings').hidden = true;
  });
  $('#btn-settings').addEventListener('click', function () {
    $('#reader-settings').hidden = !$('#reader-settings').hidden;
    syncSettingButtons();
  });
  $('#more-settings').addEventListener('click', function () {
    $('#more-menu').hidden = true;
    $('#reader-settings').hidden = false;
    syncSettingButtons();
  });

  function stepFont(dir) {
    var i = tierIndex(state.font) + dir;
    if (i < 0) {
      CC.toast('已是最小字号');
      return;
    }
    if (i >= FONT_TIERS.length) {
      CC.toast('已是最大字号');
      return;
    }
    state.font = FONT_TIERS[i];
    applyFont(true);
    CC.toast('字号：' + ['小', '中', '大'][i]);
  }
  $('#font-down').addEventListener('click', function () { stepFont(-1); });
  $('#font-up').addEventListener('click', function () { stepFont(1); });
  $('#reader-body').addEventListener('scroll', function () {
    scheduleSave();
    updateNavAndProgress(); // 滚动时同步进度条
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      saveProgress();
    }
  });
  window.addEventListener('beforeunload', saveProgress);

  /* 测试钩子：Node 侧（tests/js/reader_render.js）用它验证「页码标记不产生字符」
     这个不变量——它直接决定划词偏移会不会整体错位，而 pytest 看不到最终 HTML。
     只暴露两个纯函数，不改变任何运行时行为。 */
  window.__readerInternals = { renderContent: renderContent, pageMarkHtml: pageMarkHtml };

  (async function boot() {
    applyPrefs();
    if (!(await CC.requireAuth())) {
      return;
    }
    try {
      state.book = await CC.api('GET', '/api/v1/books/' + bookId);
    } catch (err) {
      CC.toast('加载书籍失败：' + err.message);
      setTimeout(function () { location.replace('/books.html'); }, 1500);
      return;
    }
    renderBookInfo();
    await reloadNotes();

    var index = currentChapterIndex();
    if (index == null) {
      CC.toast('这本书没有可读内容');
      return;
    }
    var chapter = chapterByIndex(index);
    var localChar = state.book.current_char - chapter.char_start;
    var span = chapter.char_end - chapter.char_start;
    await loadChapter(index, span > 0 ? localChar / span : 0);
  })();
})();
</script>
</body>
</html>
