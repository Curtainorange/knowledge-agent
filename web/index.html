<style>
:root{
  --bg:#f5f6f8; --card:#fff; --border:#e3e6ea; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-weak:#eff6ff;
  --ok:#0f766e; --ok-weak:#e6f4f1; --warn:#b45309; --warn-weak:#fef3c7;

*{box-sizing:border-box}
body{margin:0;font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{font-size:15px;font-weight:600}
.brand .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.who{display:flex;align-items:center;gap:8px}
.who label{color:var(--muted);font-size:13px}
.who input{width:150px}
main{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.field{margin-bottom:8px}
button{font:inherit;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--text)}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){opacity:.9;color:#fff}
button.danger{color:var(--danger);border-color:#f0d5d5}
button.danger:hover:not(:disabled){background:#fef2f2;border-color:var(--danger)}
button:disabled{opacity:.55;cursor:not-allowed}
button.sm{padding:3px 9px;font-size:13px}
.list{max-height:46vh;overflow:auto}
.item{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item.active{border-color:var(--accent);background:var(--accent-weak)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.snippet{color:var(--muted);font-size:13px;margin-top:4px}
.meta{color:var(--muted);font-size:12px;margin-top:5px}
.bar{height:5px;background:#eceff2;border-radius:999px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:#eef2f6;color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);cursor:default}
.full{max-height:180px;overflow:auto;white-space:pre-wrap;background:#fbfcfd;border:1px solid var(--border);
  border-radius:8px;padding:9px;font-size:13px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress-row input[type=range]{flex:1}
.progress-row .val{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;color:var(--muted);font-size:13px}
.log{min-height:240px;max-height:54vh;overflow:auto;background:#fbfcfd;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.msg{margin-bottom:10px}
.msg.user{text-align:right}
.bubble{display:inline-block;max-width:84%;padding:8px 11px;border-radius:10px;text-align:left;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--accent);color:#fff}
.msg.bot .bubble{background:#eef1f4}
.msg.sys .bubble{background:var(--warn-weak);color:var(--warn);font-size:13px}
.hit{border:1px solid var(--ok);background:var(--ok-weak);border-radius:10px;padding:10px}
.hit .hintline{margin-top:6px;font-size:13px;color:var(--warn)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:56px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2328;color:#fff;
  padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw}
#toast.show{opacity:.95}
.auth-wrap{display:flex;justify-content:center;padding:56px 20px}
.auth-card{width:100%;max-width:360px}
.auth-card button.primary{width:100%}
.who-name{font-size:13px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#auth-hint{min-height:20px;font-size:13px;color:var(--danger)}
#auth-hint.ok{color:var(--ok)}
</style>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const TOKEN_KEY = 'cc_access_token';
const REFRESH_KEY = 'cc_refresh_token';
const NAME_KEY = 'cc_username';

const state = { items: [], total: 0, detail: {}, selected: null, convId: null, username: '' };

const token = () => localStorage.getItem(TOKEN_KEY) || '';

function setSession(body){
  localStorage.setItem(TOKEN_KEY, body.access_token);
  localStorage.setItem(REFRESH_KEY, body.refresh_token || '');
  localStorage.setItem(NAME_KEY, body.username || '');
  state.username = body.username || '';
}

function clearSession(){
  [TOKEN_KEY, REFRESH_KEY, NAME_KEY].forEach((k) => localStorage.removeItem(k));
  state.username = '';
  state.convId = null;
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(method, path, body){
  const t = token();
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: `Bearer ${t}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && !path.startsWith('/api/v1/auth/')){
    // 登录态失效（过期 / 被吊销）：清理并回到登录页。
    // auth 接口自身不触发此分支，否则会把"密码错误"误报成"登录过期"。
    clearSession();
    showAuth('登录已过期，请重新登录');
    throw new Error('登录已过期');
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!res.ok){
    const d = data.detail;
    const text = typeof d === 'string' ? d : (Array.isArray(d) ? JSON.stringify(d) : (d ? JSON.stringify(d) : `HTTP ${res.status}`));
    throw new Error(text);
  }
  return data;
}

async function withLoading(btn, fn, text){
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = text || '处理中…';
  try { return await fn(); }
  finally { btn.disabled = false; btn.textContent = old; }
}

const embedBadge = (s) => s === 'embedded'
  ? '<span class="badge ok">已向量化</span>'
  : (s === 'embed_failed' ? '<span class="badge warn">向量失败·关键词兜底</span>' : '<span class="badge">待向量化</span>');

/* ---------- 登录态 ---------- */

function showAuth(msg){
  $('#auth-view').hidden = false;
  $('#app-view').hidden = true;
  $('#who-name').hidden = true;
  $('#btn-reload').hidden = true;
  $('#btn-logout').hidden = true;
  if (msg) toast(msg);
}

async function showApp(){
  $('#auth-view').hidden = true;
  $('#app-view').hidden = false;
  $('#who-name').hidden = false;
  $('#who-name').textContent = state.username;
  $('#btn-reload').hidden = false;
  $('#btn-logout').hidden = false;
  await loadItems();
}

function setAuthMode(mode){
  const isRegister = mode === 'register';
  $('#auth-view').dataset.mode = mode;
  $('#auth-title').textContent = isRegister ? '注册' : '登录';
  $('#auth-submit').textContent = isRegister ? '注册并进入' : '登录';
  $('#auth-toggle').textContent = isRegister ? '已有账号？去登录' : '没有账号？去注册';
  $('#auth-password').setAttribute('autocomplete', isRegister ? 'new-password' : 'current-password');
  $('#auth-hint').textContent = '';
  $('#auth-hint').classList.remove('ok');
}

async function submitAuth(){
  const username = $('#auth-username').value.trim();
  const password = $('#auth-password').value;
  const hint = $('#auth-hint');
  const isRegister = $('#auth-view').dataset.mode === 'register';
  hint.classList.remove('ok');
  if (!username || !password){ hint.textContent = '用户名和密码都要填'; return; }
  hint.textContent = '';
  try {
    const body = await withLoading($('#auth-submit'), () =>
      api('POST', isRegister ? '/api/v1/auth/register' : '/api/v1/auth/login', { username, password }),
      isRegister ? '注册中…' : '登录中…');
    setSession(body);
    $('#auth-password').value = '';
    await showApp();
    toast(isRegister ? '注册成功，已进入' : '欢迎回来');
  } catch (err) {
    hint.textContent = err.message;
  }
}

$('#auth-submit').addEventListener('click', submitAuth);
$('#auth-toggle').addEventListener('click', () => {
  setAuthMode($('#auth-view').dataset.mode === 'register' ? 'login' : 'register');
  $('#auth-username').focus();
});
function bindEnterToSubmit(el){
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submitAuth(); }
  });
}
bindEnterToSubmit($('#auth-username'));
bindEnterToSubmit($('#auth-password'));

$('#btn-logout').addEventListener('click', () => {
  clearSession();
  state.items = []; state.total = 0; state.detail = {}; state.selected = null;
  $('#kb-list').innerHTML = ''; $('#kb-count').textContent = '0';
  $('#mine-log').innerHTML = '';
  $('#auth-password').value = '';
  showAuth('已退出登录');
});

/* ---------- 知识库 ---------- */

function renderItems(){
  const box = $('#kb-list');
  $('#kb-count').textContent = state.total;
  if (!state.items.length){
    box.innerHTML = '<div class="empty">知识库还是空的，先在上面录一条。</div>';
    return;
  }
  box.innerHTML = state.items.map((it) => {
    const pct = Math.round((it.read_progress || 0) * 100);
    const open = state.selected === it.item_id;
    return `<div class="item ${open ? 'active' : ''}" data-id="${esc(it.item_id)}">
      <div class="row"><strong>${esc(it.title)}</strong>${embedBadge(it.embed_status)}</div>
      <div class="snippet">${esc(it.snippet)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta">已读 ${pct}% · ${esc((it.tags || []).join('、') || '无标签')}</div>
      ${open ? detailHtml(it, pct) : ''}
    </div>`;
  }).join('');
}

function detailHtml(it, pct){
  const d = state.detail[it.item_id];
  if (!d) return '<div class="detail"><div class="meta">加载中…</div></div>';
  return `<div class="detail">
    <h3>全文</h3>
    <div class="full">${esc(d.content)}</div>
    <div class="progress-row">
      <input type="range" min="0" max="100" step="5" value="${pct}" data-act="progress" data-id="${esc(it.item_id)}">
      <span class="val">${pct}%</span>
      <button class="danger sm" data-act="del" data-id="${esc(it.item_id)}">删除</button>
    </div>
    <div class="meta">来源 ${esc(d.source)} · 拖动滑块记录阅读进度</div>
  </div>`;
}

async function loadItems(){
  const r = await api('GET', '/api/v1/knowledge/items?limit=50&offset=0');
  state.items = r.items;
  state.total = r.total;
  renderItems();
}

$('#kb-list').addEventListener('click', async (e) => {
  const item = e.target.closest('.item');
  if (!item) return;
  const id = item.dataset.id;
  const act = e.target.closest('[data-act]');

  if (act && act.dataset.act === 'del'){
    if (!confirm('确定删除这条知识？（软删除，原文保留）')) return;
    try {
      await api('DELETE', `/api/v1/knowledge/items/${id}`);
      state.selected = null;
      delete state.detail[id];
      await loadItems();
      toast('已删除');
    } catch (err) { toast('删除失败：' + err.message); }
    return;
  }
  if (act) return;

  if (state.selected === id){
    state.selected = null;
  } else {
    state.selected = id;
    if (!state.detail[id]){
      renderItems();
      try { state.detail[id] = await api('GET', `/api/v1/knowledge/items/${id}`); }
      catch (err){ state.selected = null; toast('读取详情失败：' + err.message); }
    }
  }
  renderItems();
});

$('#kb-list').addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.act !== 'progress') return;
  const id = el.dataset.id;
  const value = Number(el.value) / 100;
  try {
    const r = await api('PATCH', `/api/v1/knowledge/items/${id}`, { read_progress: value });
    const it = state.items.find((x) => x.item_id === id);
    if (it) it.read_progress = value;
    if (state.detail[id]) state.detail[id].read_progress = value;
    toast(r.updated_fields.includes('read_progress') ? `已记录：已读 ${el.value}%` : '已更新');
    renderItems();
  } catch (err) { toast('保存进度失败：' + err.message); }
});

$('#k-submit').addEventListener('click', async () => {
  const title = $('#k-title').value.trim();
  const content = $('#k-content').value.trim();
  if (!title || !content){ toast('标题和正文都要填'); return; }
  const tags = $('#k-tags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const hint = $('#k-hint');
  hint.textContent = '录入中：首次调用会加载本地向量模型，可能需要几十秒…';
  try {
    const r = await withLoading($('#k-submit'), () =>
      api('POST', '/api/v1/knowledge/items', { title, content, tags }), '录入中…');
    $('#k-title').value = ''; $('#k-content').value = ''; $('#k-tags').value = '';
    hint.textContent = r.embed_status === 'embedded' ? '已录入并完成向量化' : '已录入，但向量化失败（将退回关键词召回）';
    await loadItems();
    toast('录入成功');
  } catch (err) {
    hint.textContent = '录入失败：' + err.message;
    toast('录入失败：' + err.message);
  }
});

/* ---------- L1 挖掘 ---------- */

function push(kind, html){
  const log = $('#mine-log');
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  div.innerHTML = `<div class="bubble">${html}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function pushHit(r){
  const it = (r.located_items || [])[0];
  const pct = it ? Math.round((it.read_progress || 0) * 100) : 0;
  const log = $('#mine-log');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="hit">
    <div class="row"><strong>命中：${esc(it ? it.title : '')}</strong>${it ? embedBadge(it.embed_status) : ''}</div>
    <div class="snippet">${esc(it ? it.snippet : '')}</div>
    <div class="meta">已读 ${pct}%</div>
    ${r.read_hint ? `<div class="hintline">${esc(r.read_hint)}</div>` : ''}
  </div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendMine(){
  const input = $('#mine-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  push('user', esc(msg));
  try {
    const r = await withLoading($('#mine-send'), () =>
      api('POST', '/api/v1/l1/mine', { message: msg, conversation_id: state.convId }), '挖掘中…');
    state.convId = r.conversation_id;
    if (r.state === 'located'){
      pushHit(r);
      state.convId = null;
    } else if (r.state === 'clarifying'){
      push('bot', esc(r.question || '（模型没有给出追问）'));
    } else {
      push('sys', esc(r.question || '知识库还是空的，先录入几条知识再来挖掘。'));
      state.convId = null;
    }
  } catch (err) {
    push('sys', '出错了：' + esc(err.message));
  }
  input.focus();
}

$('#mine-send').addEventListener('click', sendMine);
$('#mine-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendMine(); }
});

$('#btn-clear').addEventListener('click', () => {
  state.convId = null;
  $('#mine-log').innerHTML = '';
  toast('已开启新会话');
  $('#mine-input').focus();
});

$('#btn-reload').addEventListener('click', () => loadItems().catch((e) => toast('刷新失败：' + e.message)));

(async function boot(){
  setAuthMode('login');
  if (!token()){ showAuth(); return; }
  try {
    const me = await api('GET', '/api/v1/auth/me');
    state.username = me.username;
    await showApp();
  } catch (err) {
    // 401 已在 api() 内清理并切回登录页，避免重复提示；此处兜底其他异常
    if ($('#auth-view').hidden) showAuth('登录状态校验失败，请重新登录');
  }
})();
</script>
</body>
</html>
