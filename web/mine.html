<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="认知副驾">
<link rel="manifest" href="manifest.webmanifest">
<title>L1 挖掘 · 认知副驾</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="mine">

<header class="topbar">
  <div class="brand">认知副驾<span class="sub">L1 认知挖掘</span></div>
  <nav class="nav">
    <a href="app.html" data-nav="app">对话</a>
    <a href="knowledge.html" data-nav="knowledge">知识库</a>
    <a href="books.html" data-nav="books">书籍</a>
    <a href="mine.html" data-nav="mine">L1 挖掘</a>
    <a href="conflicts.html" data-nav="conflicts">冲突检测</a>
    <a href="brief.html" data-nav="brief">认知简报</a>
    <a href="l4.html" data-nav="l4">路径修正</a>
    <a href="l5.html" data-nav="l5">健康诊断</a>
    <a href="notify.html" data-nav="notify">通知</a>
  </nav>
  <div class="who">
    <span class="who-name" id="who-name"></span>
    <button id="btn-logout">退出</button>
  </div>
</header>

<main class="single">
  <div class="card" id="mine-card">
    <h2>按线索找回
      <button id="btn-clear" class="sm">新会话</button>
    </h2>

    <!-- 两个检索面：库里的条目 / 网上的书 -->
    <div class="tabs" id="mode-tabs">
      <button class="sm on" data-mode="kb">我的知识库</button>
      <button class="sm" data-mode="web">全网找书</button>
    </div>

    <div id="kb-panel">
      <div class="turnbar">
        <span id="turn-text">尚未开始</span>
        <span id="status-text"></span>
      </div>
      <div class="log" id="mine-log"></div>
      <div class="composer">
        <textarea id="mine-input" placeholder="用一句模糊的话描述你要找的东西，例如：之前存的那段讲查询优化的内容&#10;Ctrl + Enter 发送"></textarea>
        <button id="mine-send" class="primary">挖掘</button>
      </div>
      <div class="meta">
        线索不足时会自动追问（最多 3 轮）；命中后返回条目摘要、阅读提醒，并列出其他候选供你判断。
      </div>
    </div>

    <div id="web-panel" hidden>
      <div class="chip-cloud" id="clue-chips">
        <button class="chip" data-clue="一个人海难后独自在一个岛上活了下来，用日记记下每天怎么活——书名想不起来了">只记得情节</button>
        <button class="chip" data-clue="村上春树写的那本讲跑步和写作的书，书名忘了">只记得作者</button>
        <button class="chip" data-clue="一个男孩在魔法学校上学，和朋友们一起对抗黑魔法，好像有七本">只记得人物和设定</button>
      </div>
      <div class="turnbar">
        <span id="find-status">还没开始</span>
      </div>
      <div class="log" id="find-log"></div>
      <div class="composer">
        <textarea id="find-input" placeholder="描述你记得的部分：情节、人物、作者、封面、读它的场景都行&#10;Ctrl + Enter 发送"></textarea>
        <button id="find-send" class="primary">去网上找</button>
      </div>
      <div class="meta">
        只在网上检索公开信息，不猜书名——每条结果都带出处，并说明「你说的哪条线索对上了」。
        找书结果默认不入库，想留下哪本自己挑。
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = CC.$;
  var esc = CC.esc;
  var state = {
    mode: 'kb',
    convId: null, turn: 0, maxTurns: 3,
    clues: [],       // 找书时说过的话（作为 history 回传，越靠后越新）
    excluded: [],    // 已经看过、用户说不是的书名
    books: []        // 当前这一批候选（「记入知识库」按序号取）
  };

  function scrollLog(id) {
    var log = $(id);
    log.scrollTop = log.scrollHeight;
  }

  function append(target, kind, html) {
    var log = $(target);
    var div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.innerHTML = '<div class="bubble">' + html + '</div>';
    log.appendChild(div);
    scrollLog(target);
  }

  /* ---------------- 知识库模式 ---------------- */

  function embedBadge(status) {
    if (status === 'embedded') {
      return '<span class="badge ok">已向量化</span>';
    }
    if (status === 'embed_failed') {
      return '<span class="badge warn">关键词兜底</span>';
    }
    return '<span class="badge">待向量化</span>';
  }

  function pushUser(text) {
    append('#mine-log', 'user', esc(text));
  }

  function pushSys(text) {
    append('#mine-log', 'sys', esc(text));
  }

  function setTurn(turn, maxTurns) {
    state.turn = turn;
    state.maxTurns = maxTurns || state.maxTurns;
    var text = turn > 0 ? '已追问 ' + turn + ' / ' + state.maxTurns + ' 轮' : '尚未追问';
    $('#turn-text').textContent = text;
  }

  function setStatus(text) {
    $('#status-text').textContent = text || '';
  }

  /* 候选列表：把「模型没选中但排得靠前」的也摆出来，避免只给一条时用户无从判断 */
  function candidatesHtml(candidates, excludeIds) {
    var excluded = excludeIds || [];
    var rest = (candidates || []).filter(function (c) {
      return excluded.indexOf(c.item_id) === -1;
    });
    if (!rest.length) {
      return '';
    }
    var rows = rest.map(function (c) {
      var channels = (c.channels || []).join(' + ');
      return '<div class="cand">' +
        '<div class="cand-main">' +
          '<div class="cand-title">' + esc(c.title) + '</div>' +
          '<div class="cand-snip">' + esc(c.snippet) + '</div>' +
        '</div>' +
        '<div class="cand-side">相关度 ' + Number(c.score || 0).toFixed(2) + '<br>' + esc(channels) + '</div>' +
      '</div>';
    }).join('');
    return '<details class="candidates"><summary>其他可能（' + rest.length + '）</summary>' + rows + '</details>';
  }

  function pushHit(result) {
    var items = result.located_items || [];
    var ids = items.map(function (i) { return i.item_id; });
    var cards = items.map(function (item) {
      var pct = Math.round((item.read_progress || 0) * 100);
      return '<div class="hit">' +
        '<div class="row"><strong>命中：' + esc(item.title) + '</strong>' + embedBadge(item.embed_status) + '</div>' +
        '<div class="snippet">' + esc(item.snippet) + '</div>' +
        '<div class="meta">已读 ' + pct + '%</div>' +
        (result.read_hint ? '<div class="hintline">' + esc(result.read_hint) + '</div>' : '') +
        '<div class="actions">' +
          '<a href="knowledge.html?item=' + esc(item.item_id) + '">查看全文</a>' +
        '</div>' +
      '</div>';
    }).join('');

    var reason = result.reason ? '<div class="meta">判定依据：' + esc(result.reason) + '</div>' : '';
    var body = cards + reason + candidatesHtml(result.candidates, ids);
    append('#mine-log', 'bot', body);
  }

  function pushQuestion(result) {
    var question = result.question || '（模型没有给出追问）';
    var reason = result.reason ? '<div class="meta">为什么问这个：' + esc(result.reason) + '</div>' : '';
    append('#mine-log', 'bot', esc(question) + reason + candidatesHtml(result.candidates, []));
  }

  async function send() {
    var input = $('#mine-input');
    var message = input.value.trim();
    if (!message) {
      return;
    }
    input.value = '';
    pushUser(message);
    setStatus('挖掘中…');
    try {
      var result = await CC.withLoading($('#mine-send'), function () {
        return CC.api('POST', 'api/v1/l1/mine', {
          message: message,
          conversation_id: state.convId
        });
      }, '挖掘中…');

      state.convId = result.conversation_id;

      if (result.state === 'located') {
        pushHit(result);
        setTurn(result.turn || 0, result.max_turns);
        setStatus('已定位，本轮结束（可继续用新线索提问）');
        state.convId = null; // 命中即收束，下一条线索开新会话
      } else if (result.state === 'clarifying') {
        pushQuestion(result);
        setTurn(result.turn || 0, result.max_turns);
        setStatus('等待你的补充');
      } else {
        pushSys(result.question || '知识库还是空的，先去「知识库」录几条。');
        setStatus('');
        state.convId = null;
      }
    } catch (err) {
      pushSys('出错了：' + err.message);
      setStatus('');
    }
    input.focus();
  }

  /* ---------------- 全网找书模式 ---------------- */

  function setFindStatus(text) {
    $('#find-status').textContent = text || '';
  }

  function confidenceBadge(value) {
    var pct = Math.round((value || 0) * 100);
    if (pct >= 75) {
      return '<span class="badge ok">很可能是 ' + pct + '%</span>';
    }
    if (pct >= 45) {
      return '<span class="badge">可能是 ' + pct + '%</span>';
    }
    return '<span class="badge warn">把握不大 ' + pct + '%</span>';
  }

  /* 候选卡：书名 + 作者/年份 + 「哪条线索对上了」 + 出处 + 记入知识库。
     书名单独占一行：与置信度徽标挤在同一个 flex 行里时，窄屏会被压成
     一行三四个字（徽标占掉了半行），读起来像断码。 */
  function bookCard(book, index) {
    var meta = [book.author, book.year].filter(Boolean).join(' · ');
    var source = book.url
      ? '<span class="meta">出处：<a href="' + esc(book.url) + '" target="_blank" rel="noopener">' +
        esc(book.site || '网页') + '</a></span>'
      : '';
    return '<div class="book">' +
      '<div class="book-title">《' + esc(book.title) + '》</div>' +
      '<div class="book-line">' + confidenceBadge(book.confidence) +
        (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') +
      '</div>' +
      (book.why ? '<div class="why">' + esc(book.why) + '</div>' : '') +
      '<div class="actions">' +
        '<button class="sm" data-remember="' + index + '">记入知识库</button>' +
        source +
      '</div>' +
    '</div>';
  }

  function pushBooks(result) {
    state.books = result.books || [];
    var cards = state.books.map(bookCard).join('');
    var head = result.summary ? '<div class="book-summary">' + esc(result.summary) + '</div>' : '';
    var tail = '<div class="actions">' +
      '<button class="sm" data-retry="1">都不是，再换一批</button>' +
      '<span class="meta">查了 ' + (result.searched || 0) + ' 条网页</span>' +
    '</div>';
    append('#find-log', 'bot', head + cards + tail);
    // 这一批都进「看过了」，下一轮不再重复
    state.books.forEach(function (book) {
      if (state.excluded.indexOf(book.title) === -1) {
        state.excluded.push(book.title);
      }
    });
    setFindStatus('找到 ' + state.books.length + ' 个可能');
  }

  function pushFindQuestion(result) {
    append(
      '#find-log', 'bot',
      esc(result.question) +
      (result.note ? '<div class="meta">' + esc(result.note) + '</div>' : '')
    );
    setFindStatus('等你补充细节');
    $('#find-input').focus();
  }

  function renderFind(result) {
    if (result.state === 'found' && (result.books || []).length) {
      pushBooks(result);
      return;
    }
    if (result.state === 'clarify') {
      pushFindQuestion(result);
      return;
    }
    var note = result.note || '这次没找到，换个说法再试一次。';
    append('#find-log', 'sys', esc(note));
    setFindStatus('');
  }

  async function sendFindText(text) {
    var message = String(text || '').trim();
    if (!message) {
      return;
    }
    append('#find-log', 'user', esc(message));
    setFindStatus('正在联网检索…');
    try {
      var result = await CC.withLoading($('#find-send'), function () {
        return CC.api('POST', 'api/v1/l1/book-search', {
          message: message,
          history: state.clues.slice(-6),
          exclude: state.excluded.slice(-20)
        });
      }, '检索中…');
      state.clues.push(message);
      renderFind(result);
    } catch (err) {
      append('#find-log', 'sys', '出错了：' + esc(err.message));
      setFindStatus('');
    }
    $('#find-input').focus();
  }

  function sendFind() {
    var input = $('#find-input');
    var message = input.value.trim();
    if (!message) {
      return;
    }
    input.value = '';
    sendFindText(message);
  }

  /* 记入知识库：走既有录入链路（写库是用户的动作，找书本身不入库） */
  function rememberBook(button) {
    var book = state.books[Number(button.getAttribute('data-remember'))];
    if (!book) {
      return;
    }
    var lines = [];
    if (book.author) {
      lines.push('作者：' + book.author);
    }
    if (book.year) {
      lines.push('出版年：' + book.year);
    }
    if (book.why) {
      lines.push('为什么是这本：' + book.why);
    }
    if (book.url) {
      lines.push('出处：' + book.url);
    }
    lines.push('（通过「全网找书」定位，请自行核对后再引用）');

    CC.withLoading(button, function () {
      return CC.api('POST', 'api/v1/knowledge/items', {
        title: '《' + book.title + '》',
        content: lines.join('\n'),
        tags: ['找书']
      });
    }, '记录中…').then(function (res) {
      button.textContent = '已记入';
      button.disabled = true;
      var link = document.createElement('a');
      link.href = 'knowledge.html?item=' + encodeURIComponent(res.item_id);
      link.textContent = '查看';
      button.parentNode.insertBefore(link, button.nextSibling);
      CC.toast('已记入知识库');
    }).catch(function (err) {
      CC.toast('没记上：' + err.message);
    });
  }

  /* ---------------- 模式切换 ---------------- */

  function setMode(mode) {
    state.mode = mode;
    var isWeb = mode === 'web';
    $('#kb-panel').hidden = isWeb;
    $('#web-panel').hidden = !isWeb;
    Array.prototype.forEach.call(document.querySelectorAll('#mode-tabs button'), function (button) {
      button.classList.toggle('on', button.getAttribute('data-mode') === mode);
    });
    (isWeb ? $('#find-input') : $('#mine-input')).focus();
  }

  function clearCurrent() {
    if (state.mode === 'web') {
      state.clues = [];
      state.excluded = [];
      state.books = [];
      $('#find-log').innerHTML = '';
      setFindStatus('');
      CC.toast('已清空找书记录');
      $('#find-input').focus();
      return;
    }
    state.convId = null;
    $('#mine-log').innerHTML = '';
    setTurn(0, state.maxTurns);
    setStatus('');
    CC.toast('已开启新会话');
    $('#mine-input').focus();
  }

  /* ---------------- 事件绑定 ---------------- */

  $('#mode-tabs').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-mode]');
    if (button) {
      setMode(button.getAttribute('data-mode'));
    }
  });

  $('#clue-chips').addEventListener('click', function (event) {
    var chip = event.target.closest('.chip[data-clue]');
    if (!chip) {
      return;
    }
    var input = $('#find-input');
    input.value = chip.getAttribute('data-clue');
    input.focus();
  });

  $('#find-log').addEventListener('click', function (event) {
    var remember = event.target.closest('[data-remember]');
    if (remember) {
      rememberBook(remember);
      return;
    }
    if (event.target.closest('[data-retry]')) {
      sendFindText('刚才那几本都不是，再换几本。');
    }
  });

  $('#mine-send').addEventListener('click', send);
  $('#mine-input').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      send();
    }
  });

  $('#find-send').addEventListener('click', sendFind);
  $('#find-input').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendFind();
    }
  });

  $('#btn-clear').addEventListener('click', clearCurrent);

  (async function boot() {
    if (!(await CC.requireAuth())) {
      return;
    }
    // 支持从别处带着线索跳进来：mine.html?find=只记得情节
    var preset = new URLSearchParams(location.search).get('find');
    if (preset) {
      setMode('web');
      $('#find-input').value = preset;
      $('#find-input').focus();
      return;
    }
    $('#mine-input').focus();
  })();
})();
</script>
</body>
</html>
