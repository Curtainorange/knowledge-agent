detected_doc_type: "面向对象分析与设计课程作业 · 需求分析建模报告"
target_length: 7000
target_tone: "工程说明体，正式度★★★★☆，第一人称复数（本组），结论先行、证据编号可核"
target_reader: "《面向对象分析与设计》课程教师（按 H0/A1/H1/A2/H2 过程证据评分）"

core_points:
  - "用例模型：系统边界、参与者、用户目标级用例清单（21 项）、用例关系审查、关键用例描述、规则与验收"
  - "部分对象模型：候选对象登记、CRC、分析类图、关系与多重性、不变量、对象图验证"
  - "证据链：每个类/属性/操作/关系均有 IN/OUT/BR/REQ 依据，无依据则删除或列为待确认"
  - "人机责任：H0 人工冻结 → A1 AI 生成 → H1 人工审查 → A2 AI 修订 → H2 追踪与验收"
  - "选题：L2 隐性冲突检测（沿用第 3 课 Spec 编号体系，保证三份作业口径一致）"

scope_decision:
  use_case_model: "项目级（覆盖账号偏好、知识接入、书籍阅读、微信读书同步、L1–L5、推送巡检）"
  object_model: "部分（只对 L2 关联层三个关键用例 UC-12/UC-13/UC-14 展开分析类）"
  rationale: "课件要求对象模型'选一个关键用例'展开；用例模型回答'谁为了什么目标与系统交互'，需覆盖全系统边界"
